<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>스마트 재고 관리 시스템</title>
    <script>
      /**
       * [원본 데이터]
       * 우리 회사의 비품 재고 현황입니다.
       */
      const inventory = [
        { item: "노트북", stock: 5, price: 1200000 },
        { item: "마우스", stock: 15, price: 30000 },
        { item: "키보드", stock: 2, price: 80000 },
        { item: "모니터", stock: 8, price: 350000 },
        { item: "멀티탭", stock: 1, price: 15000 },
      ];
      let reorderList = [];
      const checkStatus = (stock) => {
        if (stock.stock < 10) {
          return true;
        } else return false;
      };

      const main = (list, func) => {
        reorderList = list.map((value) => {
          let status = "";
          let cost = 0;
          if (func(value) == true) {
            if (value.stock <= 3) {
              status = "매우 부족";
              cost = (10 - value.stock) * value.price;
            } else if (value.stock >= 4 && value.stock <= 9) {
              status = "주의";
              cost = (10 - value.stock) * value.price;
            }
            return { productName: value.item, status: status, cost: cost };
          } else {
            return null;
          }
        });
      };

      console.log("--- 최종 발주 목록 ---");
      main(inventory, checkStatus);
      console.table(reorderList);
    </script>
  </head>
  <body>
    <h1>재고 관리 시스템 정산 결과</h1>
  </body>
</html>
