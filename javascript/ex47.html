<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배열의 여러 함수들</title>
    <script>
      let str = [10, 20, 30, 40];
      // push() : 맨 뒤에 요소 추가
      // pop() : 맨 마지작 요소 삭제
      // unshift() : 맨 앞에 요소 추가
      // shift() 맨 처음 요소 삭제
      // splice() : 지우고 자리를 당겨서 채움. 추가+삭제 가능.
      // delete 연산자 : 지우고 해당 자리(인덱스)를 empty로 남겨 놓는다.
      // concat() : 배열이나 문자열 합칠 때 사용
      // sort() : 순방향 정렬(기본적으로 오름차순임)
      // reverse() : 역방향 정렬(기본적으로 내림차순임)

      // 배열의 선언
      let arr0 = []; // 빈 배열, 길이는 0
      let arr1 = [10, 20, 30]; // 길이 3
      let arr2 = new Array(); // 빈 배열, 길이는 0
      let arr3 = new Array(5); // 길이 5
      let arr4 = Array.of("11111"); // 길이 1
      console.log(arr4);
      let arr5 = Array.from("11111"); // 길이 5
      console.log(arr5);

      // push
      arr0.push(10);
      console.log(arr0);
      arr0.unshift(-10);
      console.log(arr0); // 맨 앞에 추가
      //       index 개수 값
      let arr6 = Array.from("12345");
      arr6.splice(2, 2, "2"); // "3", "4" 삭제하고 그 자리에 "2"를 넣음
      console.log(arr6);

      let arr7 = Array.from("12345");
      arr7.splice(2, 2); // "3", "4" 삭제
      console.log(arr7);

      let arr8 = Array.from("12345");
      delete arr8[1];
      console.log(arr8);

      arr8.pop(); // 맨 마지막 지우기
      console.log(arr8);

      arr8.shift(); // 맨 처음 지우기
      console.log(arr8);

      // 배열 합치기 - concat()
      let arrA = [10, 20, 30];
      let arrB = [30, 40, 50];
      let arrC = arrA.concat(arrB);
      console.log(arrC);

      // 중복하는 요소를 제거하고 합치기 : 집합함수 Set
      // 공식: new Set();
      let setA = new Set(arrC);
      console.log(setA);

      // 정렬: sort()
      // 공식 배열이름.sort();
      // 오름차순(ASC) : 값이 올라가면서 정렬됨
      let arrD = [20, 10, 30, 40, 50];
      arrD.sort();
      console.log(arrD); // 오름차순 정렬 - 주의! 원본배열이 변경되어 버림.
      console.log(arrD);

      //정렬 : reverse()
      // 공식 배열이름.reverse();
      // 오름차순(DESC) : 값이 올라가면서 정렬됨
      arrD.reverse();
      console.log(arrD); // 내림차순 정렬 - 주의! 원본배열이 변경되어 버림.
    </script>
  </head>
  <body></body>
</html>
