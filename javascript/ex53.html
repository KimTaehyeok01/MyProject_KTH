<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>함수 연습문제</title>
    <script>
      // 연습문제
      // 1. 함수의 이름은 double이고,
      // 매개변수로 number타입 1개를 받고,
      // 그 값을 결과값으로 *2 해서 반환하시오.

      function double(num) {
        return num * 2;
      }
      console.log(double(10));

      // 2. 함수의 이름은 max이고,
      //  매개변수로 number타입 3개를 입력받고,
      // 그 3개 값중에 가장 큰 수를 반환하는 함수를 만드시오.

      function max(a, b, c) {
        // let maxNum = a;
        // if (b > maxNum) {
        //   maxNum = b;
        // }
        // if (c > maxNum) {
        //   maxNum = c;
        // }
        // return maxNum;
        return Math.max(a, b, c);
      }
      console.log(max(120, 40, 30));

      //3. 복불복 게임을 함수로 설계해 보자.
      //   입력 값으로 number타입(정수 1~10사이) 1개를 입력받고,
      //   그중 정수 3과 7일 때는 "게임에 졌습니다." 문자열을 반환하고,
      //   그외의 수(1,2,4,5,6,8,9,10)일때는 "게임에 이겼습니다"
      //   문자열을 반환하는 함수를 설계하시오.
      // 호출부에서 몇번 실행하여 테스트하시오.

      function Scoregame(num) {
        let result = "";
        if (num >= 1 || num <= 10) {
          if (num === 3 || num === 7) {
            result = "게임에 졌습니다.";
          } else if (num !== 3 && num !== 7) {
            result = "게임에 이겼습니다.";
          } else {
            result = "지정된 수가 아닙니다.";
          }
          return result;
        }
      }
      let num = Number(prompt("(정수 1~10사이) 1개 입력"));
      console.log("숫자:", num, Scoregame(num));
    </script>
  </head>
  <body></body>
</html>
