      /*
        [To. 개발팀]
        디자인팀입니다. 아래 기능 구현 부탁드립니다.

        1. movies 배��� 데이터를 화면에 렌더링해주세요
           - 각 영화마다 제목과 좋아요 버튼을 표시해주세요
           - liked가 true면 ❤️, false면 🤍로 표시해주세요

        2. 좋아요 버튼을 클릭하면
           - 해당 영화의 liked 값을 반대로 바꿔주세요
           - 화면을 다시 렌더링해주세요
      */

      const movies = [
        { title: "오징어 게임", liked: false },
        { title: "킹덤", liked: false },
        { title: "지금 우리 학교는", liked: false },
        { title: "아이언맨", liked: false },
        { title: "스파이더맨", liked: false },
        { title: "범죄도시", liked: false },
      ];

      function render(data) {
        const html = data.map((movie, index) => {
          const heart = movie.liked ? "❤️" : "🤍";
          return `<li class="movie-item">
                    <span class="title">${movie.title}</span>
                    <button class="like-btn" onclick="toggleON(${index})">${heart}</Button>
                    </li>`;
        });
        document.getElementById("list-area").innerHTML = html.join("");
      }

      function toggleON(index) {
        movies[index].liked = !movies[index].liked;
        render(movies);
      }
      render(movies);
    </script>
