<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>게시글 수정</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f7f7f7;
      }
      .wrap {
        width: 700px;
        margin: 40px auto;
        background: #fff;
        padding: 24px;
        border-radius: 10px;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
      }
      textarea {
        height: 240px;
        resize: vertical;
      }
      .row {
        margin: 14px 0;
      }
      .actions {
        margin-top: 18px;
        display: flex;
        gap: 10px;
      }
      button,
      a.btn {
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #ccc;
        background: #fff;
        cursor: pointer;
        text-decoration: none;
        color: #222;
      }
      button.primary {
        background: #007bff;
        color: #fff;
        border-color: #007bff;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2>게시글 수정</h2>

      <form th:action="@{/articles/{id}/edit(id=${article.id})}" method="post">
        <input type="hidden" name="id" th:value="${article.id}" />

        <div class="row">
          <label>제목</label>
          <input
            type="text"
            name="title"
            th:value="${article.title}"
            required
          />
        </div>

        <div class="row">
          <label>내용</label>
          <textarea
            name="content"
            required
            th:text="${article.content}"
          ></textarea>
        </div>

        <div class="actions">
          <button class="primary" type="submit">수정 저장</button>
          <button
            type="button"
            class="btn-cancel"
            onclick="location.href = '/'"
          >
            취소
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
