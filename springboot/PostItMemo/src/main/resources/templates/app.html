<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StickyBoard - 나만의 메모 보드</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      /* ── App ── */
      .app {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #1a1a2e;
      }

      /* ── Toolbar ── */
      .toolbar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        height: 60px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 100;
      }

      .toolbarLeft {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logoIcon {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #fff176, #ffb300);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(255, 179, 0, 0.4);
      }

      .logoText {
        font-size: 18px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.3px;
      }

      .logoSub {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        margin-top: -2px;
      }

      .divider {
        width: 1px;
        height: 28px;
        background: rgba(255, 255, 255, 0.12);
      }

      .noteCount {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.45);
      }

      .toolbarRight {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .addBtn {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 18px;
        background: linear-gradient(135deg, #fff176, #ffd600);
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        color: #333;
        cursor: pointer;
        transition:
          transform 0.1s,
          box-shadow 0.15s;
        box-shadow: 0 3px 12px rgba(255, 214, 0, 0.35);
      }

      .addBtn:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 18px rgba(255, 214, 0, 0.5);
      }

      .addBtn:active {
        transform: translateY(0);
      }

      .clearBtn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }

      .clearBtn:hover {
        background: rgba(255, 80, 80, 0.15);
        border-color: rgba(255, 80, 80, 0.3);
        color: rgba(255, 120, 120, 0.9);
      }

      /* ── Board ── */
      .board {
        flex: 1;
        position: relative;
        overflow: hidden;
        background-color: #16213e;
        background-image:
          radial-gradient(
            circle at 20% 20%,
            rgba(90, 60, 160, 0.12) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(30, 100, 180, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 50% 50%,
            rgba(0, 0, 0, 0.1) 0%,
            transparent 70%
          );
      }

      .boardDots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.08) 1px,
          transparent 1px
        );
        background-size: 28px 28px;
        pointer-events: none;
      }

      /* ── Empty state ── */
      .emptyState {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        gap: 16px;
      }

      .emptyIcon {
        font-size: 56px;
        opacity: 0.25;
        filter: grayscale(30%);
      }

      .emptyTitle {
        font-size: 20px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.25);
      }

      .emptyDesc {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.15);
        text-align: center;
        line-height: 1.6;
      }

      /* ── Color picker in toolbar ── */
      .colorSelector {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 6px 10px;
      }

      .colorSwatch {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        transition:
          transform 0.1s,
          border-color 0.1s;
      }

      .colorSwatch:hover {
        transform: scale(1.2);
      }

      .colorSwatch.selected {
        border-color: white;
        transform: scale(1.15);
      }

      /* ── Notes container ── */
      #notesContainer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      #notesContainer .note {
        pointer-events: auto;
      }

      /* ── Sticky Note (in App) ── */
      .note {
        position: absolute;
        width: 220px;
        min-height: 200px;
        border-radius: 4px;
        padding: 0;
        box-shadow:
          4px 6px 18px rgba(0, 0, 0, 0.18),
          0 2px 4px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        user-select: none;
        transition: box-shadow 0.15s ease;
        cursor: default;
      }

      .note:hover {
        box-shadow:
          6px 10px 28px rgba(0, 0, 0, 0.22),
          0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .note.dragging {
        box-shadow:
          10px 18px 40px rgba(0, 0, 0, 0.3),
          0 6px 16px rgba(0, 0, 0, 0.15);
        transform: rotate(1.5deg) scale(1.03);
        z-index: 1000 !important;
        transition: box-shadow 0.1s ease;
      }

      .noteHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px 6px 12px;
        cursor: grab;
        border-radius: 4px 4px 0 0;
        background: rgba(0, 0, 0, 0.08);
        gap: 8px;
      }

      .noteHeader:active {
        cursor: grabbing;
      }

      .headerDots {
        display: flex;
        gap: 4px;
        align-items: center;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.2);
      }

      .colorPickerRow {
        display: flex;
        gap: 5px;
        align-items: center;
      }

      .colorBtn {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.6);
        cursor: pointer;
        transition:
          transform 0.1s,
          border-color 0.1s;
        padding: 0;
        outline: none;
      }

      .colorBtn:hover {
        transform: scale(1.25);
        border-color: rgba(255, 255, 255, 0.9);
      }

      .colorBtn.active {
        border-color: rgba(0, 0, 0, 0.4);
        transform: scale(1.2);
      }

      .deleteBtn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        transition: background 0.15s;
        color: rgba(0, 0, 0, 0.35);
        flex-shrink: 0;
      }

      .deleteBtn:hover {
        background: rgba(0, 0, 0, 0.12);
        color: rgba(0, 0, 0, 0.7);
      }

      .titleInput {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        font-size: 13px;
        font-weight: 700;
        color: rgba(0, 0, 0, 0.65);
        padding: 8px 12px 4px 12px;
        resize: none;
        cursor: text;
        font-family: inherit;
      }

      .titleInput::placeholder {
        color: rgba(0, 0, 0, 0.3);
      }

      .contentInput {
        flex: 1;
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        resize: none;
        font-size: 13px;
        color: rgba(0, 0, 0, 0.75);
        padding: 4px 12px 12px 12px;
        line-height: 1.6;
        cursor: text;
        font-family: inherit;
        min-height: 130px;
      }

      .contentInput::placeholder {
        color: rgba(0, 0, 0, 0.3);
      }

      .noteFooter {
        padding: 4px 12px 8px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .timestamp {
        font-size: 10px;
        color: rgba(0, 0, 0, 0.35);
      }

      .noteForm {
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .saveBtn {
        background: rgba(0, 0, 0, 0.1);
        border: none;
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 10px;
        cursor: pointer;
        color: rgba(0, 0, 0, 0.5);
        transition: background 0.15s;
      }

      .saveBtn:hover {
        background: rgba(0, 0, 0, 0.2);
        color: rgba(0, 0, 0, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div class="toolbarLeft">
          <div class="logo">
            <div class="logoIcon">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <rect
                  x="2"
                  y="2"
                  width="14"
                  height="14"
                  rx="2"
                  fill="rgba(0,0,0,0.3)"
                />
                <rect
                  x="3"
                  y="3"
                  width="12"
                  height="4"
                  rx="1"
                  fill="rgba(255,255,255,0.7)"
                />
                <rect
                  x="3"
                  y="9"
                  width="8"
                  height="1.5"
                  rx="0.75"
                  fill="rgba(255,255,255,0.5)"
                />
                <rect
                  x="3"
                  y="12"
                  width="5"
                  height="1.5"
                  rx="0.75"
                  fill="rgba(255,255,255,0.5)"
                />
              </svg>
            </div>
            <div>
              <div class="logoText">StickyBoard</div>
              <div class="logoSub">나만의 메모 보드</div>
            </div>
          </div>
          <div class="divider"></div>
          <span
            class="noteCount"
            id="noteCount"
            th:text="|노트 ${#lists.size(memos)}개|"
            >노트 0개</span
          >
        </div>

        <div class="toolbarRight">
          <div class="colorSelector">
            <button
              class="colorSwatch"
              data-color="yellow"
              style="background-color: #fff176"
              title="yellow"
            ></button>
            <button
              class="colorSwatch"
              data-color="pink"
              style="background-color: #f48fb1"
              title="pink"
            ></button>
            <button
              class="colorSwatch"
              data-color="blue"
              style="background-color: #90caf9"
              title="blue"
            ></button>
            <button
              class="colorSwatch"
              data-color="green"
              style="background-color: #a5d6a7"
              title="green"
            ></button>
            <button
              class="colorSwatch"
              data-color="purple"
              style="background-color: #ce93d8"
              title="purple"
            ></button>
            <button
              class="colorSwatch"
              data-color="orange"
              style="background-color: #ffcc80"
              title="orange"
            ></button>
          </div>

          <form
            id="addForm"
            method="post"
            th:action="@{/memos}"
            style="display: contents"
          >
            <input
              type="hidden"
              name="color"
              id="addFormColor"
              value="yellow"
            />
            <input type="hidden" name="title" value="" />
            <input type="hidden" name="content" value="" />
            <input type="hidden" name="posX" id="addFormPosX" value="80" />
            <input type="hidden" name="posY" id="addFormPosY" value="80" />
            <input type="hidden" name="zIndex" value="1" />
            <button class="addBtn" type="submit">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path
                  d="M7 1V13M1 7H13"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                />
              </svg>
              새 포스트잇
            </button>
          </form>

          <form
            method="post"
            th:action="@{/memos/clear}"
            style="display: contents"
          >
            <button
              class="clearBtn"
              id="clearBtn"
              type="submit"
              th:style="${#lists.size(memos)} > 0 ? 'display:flex' : 'display:none'"
              style="display: none"
              onclick="
                return confirm(
                  '\ubaa8\ub4e0 \ud3ec\uc2a4\ud2b8\uc787\uc744 \uc0ad\uc81c\ud560\uae4c\uc694?',
                );
              "
            >
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path
                  d="M1.5 3h9M4.5 3V1.5h3V3M10.5 3l-.75 7.5h-7.5L1.5 3"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              전체 삭제
            </button>
          </form>
        </div>
      </header>

      <main class="board" id="board">
        <div class="boardDots"></div>

        <div
          class="emptyState"
          id="emptyState"
          th:style="${#lists.size(memos)} == 0 ? 'display:flex' : 'display:none'"
        >
          <div class="emptyIcon">📝</div>
          <div class="emptyTitle">포스트잇이 없어요</div>
          <div class="emptyDesc">
            상단의 '새 포스트잇' 버튼을 눌러<br />
            첫 번째 메모를 추가해보세요!
          </div>
        </div>

        <div id="notesContainer">
          <!-- DB 메모 렌더링 -->
          <div
            class="note"
            th:each="note : ${memos}"
            th:id="|note-${note.id}|"
            th:attr="data-note-id=${note.id}, data-note-color=${note.color}"
            th:style="|left:${note.posX}px; top:${note.posY}px; z-index:${note.zIndex}; background-color:${note.color == 'yellow' ? '#FFF176' : (note.color == 'pink' ? '#F48FB1' : (note.color == 'blue' ? '#90CAF9' : (note.color == 'green' ? '#A5D6A7' : (note.color == 'purple' ? '#CE93D8' : '#FFCC80'))))};|"
          >
            <div class="noteHeader">
              <div class="headerDots">
                <span class="dot"></span><span class="dot"></span
                ><span class="dot"></span>
              </div>

              <form
                th:action="@{/memos/{id}/color(id=${note.id})}"
                method="post"
                class="colorPickerRow"
              >
                <button
                  class="colorBtn"
                  type="submit"
                  name="color"
                  value="yellow"
                  data-color="yellow"
                  style="background-color: #fff176"
                  title="yellow"
                  th:classappend="${note.color == 'yellow'} ? ' active' : ''"
                ></button>
                <button
                  class="colorBtn"
                  type="submit"
                  name="color"
                  value="pink"
                  data-color="pink"
                  style="background-color: #f48fb1"
                  title="pink"
                  th:classappend="${note.color == 'pink'} ? ' active' : ''"
                ></button>
                <button
                  class="colorBtn"
                  type="submit"
                  name="color"
                  value="blue"
                  data-color="blue"
                  style="background-color: #90caf9"
                  title="blue"
                  th:classappend="${note.color == 'blue'} ? ' active' : ''"
                ></button>
                <button
                  class="colorBtn"
                  type="submit"
                  name="color"
                  value="green"
                  data-color="green"
                  style="background-color: #a5d6a7"
                  title="green"
                  th:classappend="${note.color == 'green'} ? ' active' : ''"
                ></button>
                <button
                  class="colorBtn"
                  type="submit"
                  name="color"
                  value="purple"
                  data-color="purple"
                  style="background-color: #ce93d8"
                  title="purple"
                  th:classappend="${note.color == 'purple'} ? ' active' : ''"
                ></button>
                <button
                  class="colorBtn"
                  type="submit"
                  name="color"
                  value="orange"
                  data-color="orange"
                  style="background-color: #ffcc80"
                  title="orange"
                  th:classappend="${note.color == 'orange'} ? ' active' : ''"
                ></button>
              </form>

              <form
                th:action="@{/memos/{id}/delete(id=${note.id})}"
                method="post"
                style="display: contents"
              >
                <button class="deleteBtn" type="submit" title="삭제">
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path
                      d="M1 1L11 11M11 1L1 11"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                    />
                  </svg>
                </button>
              </form>
            </div>

            <form
              th:action="@{/memos/{id}(id=${note.id})}"
              method="post"
              class="noteForm"
            >
              <input
                type="hidden"
                name="posX"
                th:value="${note.posX}"
                class="posXInput"
              />
              <input
                type="hidden"
                name="posY"
                th:value="${note.posY}"
                class="posYInput"
              />
              <input
                type="hidden"
                name="zIndex"
                th:value="${note.zIndex}"
                class="zIndexInput"
              />
              <textarea
                class="titleInput"
                name="title"
                placeholder="제목..."
                rows="1"
                th:text="${note.title}"
              ></textarea>
              <textarea
                class="contentInput"
                name="content"
                placeholder="내용을 입력하세요..."
                th:text="${note.content}"
              ></textarea>

              <div class="noteFooter">
                <span
                  class="timestamp"
                  th:text="${note.createdAt != null} ? ${#temporals.format(note.createdAt, 'M/d HH:mm')} : ''"
                ></span>
                <button type="submit" class="saveBtn">저장</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>

    <script th:inline="javascript">
      const NOTE_COLORS = [
        { id: "yellow", bg: "#FFF176" },
        { id: "pink", bg: "#F48FB1" },
        { id: "blue", bg: "#90CAF9" },
        { id: "green", bg: "#A5D6A7" },
        { id: "purple", bg: "#CE93D8" },
        { id: "orange", bg: "#FFCC80" },
      ];

      let selectedColor = "yellow";

      const board = document.getElementById("board");
      const notesContainer = document.getElementById("notesContainer");
      const emptyState = document.getElementById("emptyState");
      const noteCountEl = document.getElementById("noteCount");
      const clearBtn = document.getElementById("clearBtn");

      function updateUI() {
        const count = notesContainer.querySelectorAll(".note").length;
        noteCountEl.textContent = `노트 ${count}개`;
        emptyState.style.display = count === 0 ? "flex" : "none";
        clearBtn.style.display = count > 0 ? "flex" : "none";
      }

      function bringToFront(div) {
        const currentMax = Math.max(
          10,
          ...[...notesContainer.querySelectorAll(".note")].map((n) =>
            Number(n.style.zIndex || 0),
          ),
        );
        div.style.zIndex = String(currentMax + 1);
      }

      function wireNoteElement(div) {
        const header = div.querySelector(".noteHeader");
        const titleInput = div.querySelector(".titleInput");
        const contentInput = div.querySelector(".contentInput");
        const noteForm = div.querySelector(".noteForm");
        const colorForm = div.querySelector(".colorPickerRow");

        titleInput.onmousedown = contentInput.onmousedown = (e) =>
          e.stopPropagation();

        // ── 색상 변경: fetch 비동기 + 즉시 UI 반영 ──────────────────
        if (colorForm) {
          colorForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const colorValue = e.submitter.value;
            const formData = new FormData();
            formData.append("color", colorValue);
            fetch(colorForm.action, {
              method: "POST",
              body: formData,
              headers: { "X-Requested-With": "XMLHttpRequest" },
            });

            const bg =
              NOTE_COLORS.find((c) => c.id === colorValue)?.bg ?? "#FFF176";
            div.style.backgroundColor = bg;
            div.dataset.noteColor = colorValue;
            colorForm
              .querySelectorAll(".colorBtn")
              .forEach((b) =>
                b.classList.toggle("active", b.value === colorValue),
              );
          });
        }

        // ── 드래그 ───────────────────────────────────────────────────
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };

        const onMouseDown = (e) => {
          if (e.target.closest("button, textarea, input, form")) return;
          isDragging = true;
          div.classList.add("dragging");
          bringToFront(div);

          const rect = div.getBoundingClientRect();
          dragOffset = { x: e.clientX - rect.left, y: e.clientY - rect.top };

          const onMouseMove = (ev) => {
            if (!isDragging) return;
            const boardRect = board.getBoundingClientRect();
            let newX = ev.clientX - boardRect.left - dragOffset.x;
            let newY = ev.clientY - boardRect.top - dragOffset.y;
            newX = Math.max(
              0,
              Math.min(newX, boardRect.width - div.offsetWidth),
            );
            newY = Math.max(
              0,
              Math.min(newY, boardRect.height - div.offsetHeight),
            );
            div.style.left = newX + "px";
            div.style.top = newY + "px";
          };

          const onMouseUp = () => {
            isDragging = false;
            div.classList.remove("dragging");

            const newX = parseInt(div.style.left);
            const newY = parseInt(div.style.top);
            const newZ = div.style.zIndex;

            // hidden input 업데이트
            const posXInput = div.querySelector(".posXInput");
            const posYInput = div.querySelector(".posYInput");
            const zIndexInput = div.querySelector(".zIndexInput");
            if (posXInput) posXInput.value = newX;
            if (posYInput) posYInput.value = newY;
            if (zIndexInput) zIndexInput.value = newZ;

            // ── 위치 자동 저장 (fetch 비동기) ──────────────────────
            if (noteForm) {
              const formData = new FormData(noteForm);
              fetch(noteForm.action, {
                method: "POST",
                body: formData,
                headers: { "X-Requested-With": "XMLHttpRequest" },
              });
            }

            window.removeEventListener("mousemove", onMouseMove);
            window.removeEventListener("mouseup", onMouseUp);
          };

          window.addEventListener("mousemove", onMouseMove);
          window.addEventListener("mouseup", onMouseUp);
        };

        div.onmousedown = onMouseDown;
        header.onmousedown = onMouseDown;
      }

      notesContainer.querySelectorAll(".note").forEach(wireNoteElement);

      document.querySelectorAll(".colorSwatch").forEach((btn) => {
        btn.onclick = () => {
          selectedColor = btn.dataset.color;
          document
            .querySelectorAll(".colorSwatch")
            .forEach((b) =>
              b.classList.toggle("selected", b.dataset.color === selectedColor),
            );
        };
      });
      document
        .querySelector('.colorSwatch[data-color="yellow"]')
        .classList.add("selected");

      document
        .getElementById("addForm")
        .addEventListener("submit", function () {
          document.getElementById("addFormColor").value = selectedColor;
          document.getElementById("addFormPosX").value =
            Math.floor(Math.random() * 400) + 40;
          document.getElementById("addFormPosY").value =
            Math.floor(Math.random() * 200) + 40;
        });

      updateUI();
    </script>
  </body>
</html>
