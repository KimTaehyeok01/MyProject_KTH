<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>자판기 관리 시스템</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            color: #333;
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .vm-card {
            width: 900px;
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #1a73e8;
            font-size: 2.5em;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            overflow: hidden;
            border-radius: 10px;
        }

        th {
            background-color: #1a73e8;
            color: white;
            padding: 15px;
            font-weight: 500;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background-color 0.3s;
        }

        tr:hover td { background-color: #f8fbff; }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8f9fa;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .count-info { color: #555; font-size: 1.1em; }
        .count-info span { color: #1a73e8; font-weight: bold; }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add {
            background-color: #1a73e8;
            color: white;
            font-size: 1.1em;
            padding: 15px 40px;
        }
        .btn-add:hover { background-color: #1557b0; transform: translateY(-2px); }

        .btn-edit { background-color: #e8f0fe; color: #1a73e8; }
        .btn-edit:hover { background-color: #1a73e8; color: white; }

        .btn-delete { background-color: #fee8e8; color: #d93025; }
        .btn-delete:hover { background-color: #d93025; color: white; }

        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="vm-card">
    <h1>자판기 프로그램</h1>

    <table>
        <thead>
        <tr>
            <th>번호</th>
            <th>상품명</th>
            <th>판매 가격</th>
            <th>유통 기한</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${list}">
            <td th:text="${p.productNo}"></td>
            <td th:text="${p.productName}" style="font-weight: bold;"></td>
            <td th:text="${#numbers.formatInteger(p.productPrice, 3, 'COMMA') + '원'}"></td>
            <td th:text="${p.productLimitDate}"></td>
            <td>
                <button class="btn-edit" th:onclick="|location.href='@{/editForm(id=${p.productNo})}'|">수정</button>
                <button class="btn-delete"
                        th:onclick="|if(confirm('정말 삭제하시겠습니까?')) location.href='@{/deleteProduct(id=${p.productNo})}'|">
                    삭제
                </button>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="status-bar">
        <div class="count-info">현재 등록된 상품: <span th:text="${list.size()}">0</span>개</div>
        <button class="btn-add" onclick="location.href='/addForm'">+ 새 상품 등록</button>
    </div>
</div>

</body>
</html>
