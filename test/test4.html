<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>배열 실무 기초 테스트</title>
    <script>
      /* ========================================================
         [문제 1] 배열의 기본 조작 (생성과 접근)
         
         1. `fruits` 배열을 만드세요. 들어갈 값: "사과", "바나나", "망고"
         2. `fruits`의 두 번째 아이템("바나나")을 콘솔에 출력하세요.
         3. "망고"를 "수박"으로 값을 변경(재할당)하세요.
         4. 최종 배열을 출력하세요.
         ======================================================== */
      console.log("=== 문제 1 ===");
      // ↓↓↓ 코드 작성
      let fruits = ["사과", "바나나", "망고"];
      console.log(fruits[1]);
      fruits[2] = "수박";
      console.log(fruits);

      /* ========================================================
         [문제 2] 앞뒤로 넣고 빼기 (Stack & Queue)
         
         1. `numbers` 배열 생성: [1, 2, 3]
         2. 맨 뒤에 숫자 4와 5를 추가하세요. (push 활용)
         3. 맨 앞의 숫자(1)를 삭제하세요. (shift 활용)
         4. 맨 앞에 숫자 0을 추가하세요. (unshift 활용)
         5. 맨 뒤의 숫자(5)를 삭제하세요. (pop 활용)
         6. 최종 결과가 [0, 2, 3, 4]가 나와야 합니다. 출력해서 확인하세요.
         ======================================================== */
      console.log("=== 문제 2 ===");
      // ↓↓↓ 코드 작성
      const numbers = [1, 2, 3];
      numbers.push(4, 5);
      numbers.shift();
      numbers.unshift(0);
      numbers.pop();
      console.log(numbers);

      /* ========================================================
         [문제 3] 만능 도구 Splice (중간 삭제 및 삽입)
         
         1. `team` 배열 생성: ["철수", "영희", "민수", "동수"]
         2. 배열에서 "민수"를 삭제하세요.
         3. "영희" 바로 뒤에 "길동"을 추가하세요.
         4. 최종 결과가 ["철수", "영희", "길동", "동수"] 가 되어야 합니다.
         ======================================================== */
      console.log("=== 문제 3 ===");
      // ↓↓↓ 코드 작성
      const team = ["철수", "영희", "민수", "동수"];
      team.splice(2, 1);
      console.log(team);
      team.splice(2, 0, "길동");
      console.log(team);

      /* ========================================================
         [문제 4] 문자열 파싱과 정렬 (Split & Sort)
         
         1. 문자열 `data` 생성: "사자,호랑이,강아지,고양이"
         2. 쉼표(,)를 기준으로 잘라서 배열 `animals`로 만드세요.
         3. `animals` 배열을 가나다순(오름차순)으로 정렬하세요.
         4. 정렬된 배열을 출력하세요.
         ======================================================== */
      console.log("=== 문제 4 ===");
      // ↓↓↓ 코드 작성
      const data = "사자,호랑이,강아지,고양이";
      const animals = data.split(",");
      animals.sort();
      console.log(animals);
    </script>
  </head>
  <body>
    <h1>Array Basic Test</h1>
    <p>F12 콘솔창을 확인하세요.</p>
  </body>
</html>
