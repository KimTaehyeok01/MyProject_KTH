<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Function with Array</title>
    <script>
      /* =================================================================
           [미션] 배열을 처리하는 함수 만들기 (4문제)

           * 모든 함수는 배열을 '매개변수'로 입력받습니다.
           * 결과값을 반드시 'return' 해야 합니다.
           ================================================================= */

      // 1. [배열의 합계 구하기]
      // - 함수 이름: sumList
      // - 매개변수: 숫자 배열 (예: [10, 20, 30])
      // - 기능: 배열 안에 있는 모든 숫자를 더해서 그 합계를 반환하시오.

      // ↓↓↓ 코드 작성 (함수 선언부터 직접)
      function sumList(arr) {
        let total = 0;
        for (let index of arr) {
          total += index;
        }
        return total;
      }

      let arrNum = [10, 20, 30];
      console.log(sumList(arrNum));

      // 2. [가장 큰 수 찾기] (아까 했던 MVP 로직의 함수 버전)
      // - 함수 이름: findMax
      // - 매개변수: 숫자 배열
      // - 기능: 배열 안의 숫자 중 '가장 큰 수'를 찾아 반환하시오.
      // (힌트: let max = 0; 해놓고 반복문 돌리기)

      // ↓↓↓ 코드 작성
      function findMax(arr) {
        let max = 0;
        for (let index of arr) {
          if (index > max) {
            max = index;
          }
        }
        return max;
      }

      let arrNum1 = [10, 20, 30, 60, 93, 21, 100];
      console.log(findMax(arrNum1));

      // 3. [특정 물건 찾기] (True/False 반환)
      // - 함수 이름: hasItem
      // - 매개변수: 문자열 배열(list), 찾는 물건(target) -> 매개변수 2개!
      // - 기능:
      //    * 배열 안에 target과 똑같은 문자가 있으면 true 반환
      //    * 없으면 false 반환
      // (힌트: if (list[i] == target) ...)

      // ↓↓↓ 코드 작성
      function hasItem(list, target) {
        let isfalse = false;
        for (let i = 0; i < list.length; i++) {
          if (list[i] == target) {
            isfalse = true;
            break;
          }
        }
        return isfalse;
      }

      const product_list = ["칼", "총", "탱크", "전투기"];
      console.log(hasItem(product_list, "전투기"));

      // 4. [짝수 개수 세기]
      // - 함수 이름: countEven
      // - 매개변수: 숫자 배열
      // - 기능: 배열 안에 '짝수'가 몇 개 있는지 세어서, 그 '개수'를 반환하시오.
      // (힌트: num % 2 == 0 이면 count 증가)

      // ↓↓↓ 코드 작성

      function countEven(arr) {
        let count = 0;
        for (let index of arr) {
          if (index % 2 == 0) {
            count += 1;
          }
        }
        return count;
      }

      let numArr1 = [10, 50, 20, 5, 100];
      console.log(countEven(numArr1));

      /* ===============================================================
           [테스트용 데이터]
           아래 코드는 건드리지 말고, F12 콘솔에서 결과가 잘 나오는지 확인만 하세요.
           =============================================================== */
      let numArr = [10, 50, 20, 5, 100];
      let strArr = ["사과", "바나나", "포도", "수박"];

      console.log("1. 합계(185):", sumList(numArr));
      console.log("2. 최대값(100):", findMax(numArr));

      console.log("3. 포도 있니?(true):", hasItem(strArr, "포도"));
      console.log("3. 컴퓨터 있니?(false):", hasItem(strArr, "컴퓨터"));

      //   console.log("4. 짝수 개수(4개):", countEven(numArr));
      // 10, 50, 20, 100 -> 4개 (5는 홀수)
    </script>
  </head>
  <body>
    <h1>배열 + 함수 미션</h1>
  </body>
</html>
