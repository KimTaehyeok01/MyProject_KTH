<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>게시글 상세</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f7f7f7;
      }
      .wrap {
        width: 900px;
        margin: 40px auto;
        background: #fff;
        padding: 24px;
        border-radius: 10px;
      }
      .row {
        margin: 14px 0;
      }
      .label {
        font-weight: bold;
        width: 80px;
        display: inline-block;
      }
      pre {
        background: #fafafa;
        padding: 12px;
        border-radius: 8px;
        white-space: pre-wrap;
      }
      a.btn {
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        text-decoration: none;
        color: #222;
        margin-right: 8px;
      }
      a.btn.primary {
        background: #007bff;
        color: #fff;
        border-color: #007bff;
      }
      a.btn.danger {
        background: #dc3545;
        color: #fff;
        border-color: #dc3545;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2>게시글 상세</h2>

      <div class="row">
        <span class="label">ID</span>
        <span th:text="${article.id}">1</span>
      </div>

      <div class="row">
        <span class="label">제목</span>
        <span th:text="${article.title}">제목</span>
      </div>

      <div class="row">
        <span class="label">이름</span>
        <span th:text="${article.userName}">이름</span>
      </div>

      <div class="row">
        <span class="label">내용</span>
        <pre th:text="${article.content}">내용</pre>
      </div>

      <div style="margin-top: 18px">
          <a class="btn" th:onclick="|location.href='/'|">목록</a>
          <a
          class="btn primary"
          th:href="@{/articles/{id}/edit(id=${article.id})}"
          >수정</a
        >
        <a
          class="btn danger"
          th:href="@{/articles/{id}/delete(id=${article.id})}"
          >삭제</a
        >
      </div>
    </div>
  </body>
</html>
