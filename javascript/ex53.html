<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>함수 연습문제</title>
    <script>
      // 연습문제
      // 1. 함수의 이름은 double이고,
      // 매개변수로 number타입 1개를 받고,
      // 그 값을 결과값으로 *2 해서 반환하시오.

      function double(num) {
        return num * 2;
      }
      console.log(double(10));

      // 2. 함수의 이름은 max이고,
      //  매개변수로 number타입 3개를 입력받고,
      // 그 3개 값중에 가장 큰 수를 반환하는 함수를 만드시오.

      function max(a, b, c) {
        let maxNum = a;
        if (b > maxNum) {
          maxNum = b;
        }
        if (c > maxNum) {
          maxNum = c;
        }
        return maxNum;
      }
      console.log(max(10, 20, 30));
    </script>
  </head>
  <body></body>
</html>
