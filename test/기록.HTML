<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Netflix Practice - 좋아요 기능</title>
    <style>
      body {
        background-color: #141414;
        color: white;
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        padding-top: 50px;
      }
      .container {
        width: 500px;
      }
      h1 {
        color: #e50914;
        text-align: center;
        margin-bottom: 30px;
      }

      .filter-buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        justify-content: center;
      }
      .filter-btn {
        background-color: #333;
        color: white;
        border: 2px solid #555;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s;
      }
      .filter-btn:hover {
        border-color: #e50914;
      }
      .filter-btn.active {
        background-color: #e50914;
        border-color: #e50914;
        font-weight: bold;
      }

      .movie-list {
        list-style: none;
        padding: 0;
      }
      .movie-item {
        background: #222;
        margin-bottom: 15px;
        padding: 20px;
        border-radius: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: transform 0.2s;
      }
      .movie-item:hover {
        transform: scale(1.02);
        background: #2a2a2a;
      }

      .movie-info {
        flex-grow: 1;
      }
      .title {
        font-weight: bold;
        font-size: 20px;
        margin-bottom: 8px;
      }
      .genre {
        font-size: 12px;
        color: #aaa;
        background: #000;
        padding: 4px 10px;
        border-radius: 4px;
        display: inline-block;
        margin-right: 8px;
      }
      .rating {
        color: #ffd700;
        font-size: 14px;
      }

      .like-btn {
        background: none;
        border: none;
        font-size: 30px;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .like-btn:hover {
        transform: scale(1.2);
      }
      .like-btn.liked {
        animation: heartBeat 0.3s;
      }

      @keyframes heartBeat {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.3);
        }
      }

      .stats {
        background: #222;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 14px;
        color: #aaa;
      }
      .stats span {
        color: #e50914;
        font-weight: bold;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎬 NETFLIX 영화 목록</h1>

      <div class="stats">
        전체 영화: <span id="total-count">0</span>개 | 좋아요:
        <span id="liked-count">0</span>개
      </div>

      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">전체</button>
        <button class="filter-btn" data-filter="liked">❤️ 좋아요만</button>
        <button class="filter-btn" data-filter="high-rated">
          ⭐ 평점높은순
        </button>
      </div>

      <ul class="movie-list" id="movie-list"></ul>
    </div>

    <script>
      // prettier-ignore
      const movies = [
        { id: 0, title: "오징어 게임", genre: "스릴러", rating: 8.5, liked: false },
        { id: 1, title: "킹덤", genre: "좀비/사극", rating: 8.3, liked: false },
        { id: 2, title: "지금 우리 학교는", genre: "좀비/학원", rating: 7.8, liked: false },
        { id: 3, title: "아이언맨", genre: "SF/액션", rating: 8.9, liked: false },
        { id: 4, title: "스파이더맨", genre: "액션", rating: 8.7, liked: false },
        { id: 5, title: "범죄도시", genre: "액션/코미디", rating: 8.2, liked: false },
        { id: 6, title: "기생충", genre: "스릴러/드라마", rating: 9.2, liked: false },
        { id: 7, title: "헤어질 결심", genre: "로맨스/미스터리", rating: 7.5, liked: false },
      ];

      const movieList = document.getElementById("movie-list");
      const totalCount = document.getElementById("total-count");
      const likedCount = document.getElementById("liked-count");
      const filterButtons = document.querySelectorAll(".filter-btn");

      function render(data) {
        const html = data
          .map((movie) => {
            const heart = movie.liked ? "❤️" : "🤍";
            return `
            <li class="movie-item">
              <div class="movie-info">
                <div class="title">${movie.title}</div>
                <span class="genre">${movie.genre}</span>
                <span class="rating">⭐ ${movie.rating}</span>
              </div>
              <button class="like-btn" data-id="${movie.id}">${heart}</button>
            </li>
          `;
          })
          .join("");
        movieList.innerHTML = html;
      }

      function updateStats() {
        totalCount.textContent = movies.length;
        const liked = movies.filter((movie) => movie.liked).length;
        likedCount.textContent = liked;
      }

      movieList.addEventListener("click", (e) => {
        if (e.target.classList.contains("like-btn")) {
          const id = Number(e.target.dataset.id);
          const movie = movies.find((m) => m.id === id);
          movie.liked = !movie.liked;
          e.target.textContent = movie.liked ? "❤️" : "🤍";
          updateStats();
        }
      });

      filterButtons.forEach((btn) => {
        btn.addEventListener("click", (e) => {
          filterButtons.forEach((b) => b.classList.remove("active"));
          e.target.classList.add("active");

          const filter = e.target.dataset.filter;
          let result = movies;

          if (filter === "liked") {
            result = movies.filter((movie) => movie.liked);
          } else if (filter === "high-rated") {
            result = movies.filter((movie) => movie.rating >= 8.0);
          }

          render(result);
        });
      });

      render(movies);
      updateStats();
    </script>
  </body>
</html>
