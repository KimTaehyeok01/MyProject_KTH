spring.application.name=Ex19AssoMapping

#thymeleaf
spring.thymeleaf.cache=false

# H2 Database
# mem : Memory(ram) DB app runtime -> valid, off -> delete
# testdb : database name
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver

# H2 id/pw
spring.datasource.username=sa
spring.datasource.password=

# JPA
# create : \uC571 \uC2E4\uD589\uC2DC \uAE30\uC874\uD14C\uC774\uBE14 \uC9C0\uC6B0\uACE0, \uC5D4\uD2F0\uD2F0 \uD074\uB798\uC2A4\uC758 \uB0B4\uC6A9\uC744 \uC0DD\uC131\uD568.
# validate : \uC2E4\uC81C db\uB97C \uAC80\uC99D\uD574\uC11C \uB2E4\uB974\uBA74, \uC5D0\uB7EC\uB97C \uBC1C\uC0DD\uC2DC\uD0A8\uB2E4.
# update : \uC2E4db\uC640 \uC5D4\uD2F0\uD2F0 \uB0B4\uC6A9\uC774 \uB2E4\uB974\uBA74 \uC5C5\uB370\uC774\uD2B8\uD55C\uB2E4.
# none : \uC544\uBB34\uAC83\uB3C4 \uD558\uC9C0 \uC54A\uB294\uB2E4.
# create-drop : \uC571 \uC885\uB8CC\uC2DC \uC2E4\uC81C db\uB97C \uC9C0\uC6B4\uB2E4.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# H2 Console
# \uC571 \uC2E4\uD589 \uC911 localhost:8080/h2console \uC811\uC18D
spring.h2.console.enabled=true

spring.output.ansi.enabled=always
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}