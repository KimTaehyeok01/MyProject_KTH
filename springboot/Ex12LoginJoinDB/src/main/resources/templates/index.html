<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Title</title>
</head>
<body>
    <h3>메인화면</h3>
    <th:block th:if="${session.isLogin == true}">
        <p th:utext="|로그인 상태입니다. <br>회원 아이디: ${session.userId}|"></p>
        <button type="button" th:onclick="|location.href='/loginoutAction'|">로그아웃</button>
    </th:block>

    <th:block th:if="${session.isLogin == null}">
        <p>로그아웃 상태입니다.</p>
        <button type="button" th:onclick="|location.href='/loginForm'|">
            로그인 화면으로 이동
        </button>
    </th:block>
</body>
</html>
