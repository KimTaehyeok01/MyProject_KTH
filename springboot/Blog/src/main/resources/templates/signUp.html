<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <style>
      /* ── CSS 변수 ── */
      :root {
        --bg: #f0f2f5;
        --surface: #ffffff;
        --surface-alt: #f8f9fa;
        --border: #e4e7ec;
        --text-primary: #1a1d23;
        --text-secondary: #5c6370;
        --text-muted: #9399a6;
        --accent: #4f6ef7;
        --accent-hover: #3a57e0;
        --accent-soft: #eef1fe;
        --danger: #e84545;
        --danger-soft: #fff0f0;
        --success: #22c55e;
        --success-soft: #f0fdf4;
        --shadow-sm:
          0 1px 3px rgba(0, 0, 0, 0.07), 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.1);
        --radius: 12px;
        --radius-sm: 8px;
        --transition: 0.18s ease;
      }
      body.dark {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface-alt: #22263a;
        --border: #2e3347;
        --text-primary: #e8eaf0;
        --text-secondary: #9399a6;
        --text-muted: #5c6370;
        --accent-soft: #1e2548;
        --danger-soft: #2a1515;
        --success-soft: #0d2a1a;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.4);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100vh;
        transition:
          background var(--transition),
          color var(--transition);
      }

      /* ── 네비 바 ── */
      .nav-bar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0 24px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: var(--shadow-sm);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .nav-logo {
        font-size: 18px;
        font-weight: 700;
        color: var(--accent);
        text-decoration: none;
        letter-spacing: -0.3px;
      }
      .nav-logo span {
        color: var(--text-primary);
      }
      .theme-toggle {
        width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-alt);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: var(--text-secondary);
        transition:
          background var(--transition),
          border-color var(--transition);
      }
      .theme-toggle:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }

      /* ── 페이지 레이아웃 ── */
      .page-body {
        min-height: calc(100vh - 56px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
      }

      /* ── 카드 ── */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
        padding: 40px 40px 36px;
        width: 100%;
        max-width: 460px;
      }
      .card-header {
        text-align: center;
        margin-bottom: 32px;
      }
      .card-header .icon {
        font-size: 36px;
        margin-bottom: 10px;
        display: block;
      }
      .card-header h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.4px;
        margin-bottom: 6px;
      }
      .card-header p {
        font-size: 14px;
        color: var(--text-muted);
      }

      /* ── 폼 ── */
      .form-group {
        margin-bottom: 18px;
      }
      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 7px;
        letter-spacing: 0.1px;
      }
      .form-label .required {
        color: var(--danger);
        margin-left: 2px;
      }
      .input-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }
      .input-icon {
        position: absolute;
        left: 13px;
        font-size: 15px;
        color: var(--text-muted);
        pointer-events: none;
        line-height: 1;
      }
      .form-input {
        width: 100%;
        padding: 10px 14px 10px 38px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 14px;
        color: var(--text-primary);
        background: var(--surface);
        outline: none;
        transition:
          border-color var(--transition),
          box-shadow var(--transition),
          background var(--transition);
      }
      .form-input::placeholder {
        color: var(--text-muted);
      }
      .form-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.15);
      }

      /* 비밀번호 눈 아이콘 */
      .toggle-pw {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
        color: var(--text-muted);
        padding: 2px;
        line-height: 1;
        transition: color var(--transition);
      }
      .toggle-pw:hover {
        color: var(--text-primary);
      }

      /* 비밀번호 강도 바 */
      .pw-strength {
        margin-top: 7px;
        display: none;
      }
      .pw-strength.visible {
        display: block;
      }
      .pw-strength-bar {
        height: 4px;
        border-radius: 4px;
        background: var(--border);
        overflow: hidden;
        margin-bottom: 4px;
      }
      .pw-strength-fill {
        height: 100%;
        border-radius: 4px;
        transition:
          width 0.3s ease,
          background 0.3s ease;
        width: 0%;
      }
      .pw-strength-label {
        font-size: 11px;
        color: var(--text-muted);
      }

      /* 구분선 */
      .divider {
        height: 1px;
        background: var(--border);
        margin: 24px 0;
      }

      /* ── 버튼 ── */
      .btn-submit {
        width: 100%;
        padding: 12px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.2px;
        transition:
          background var(--transition),
          box-shadow var(--transition),
          transform 0.1s ease;
        box-shadow: 0 2px 8px rgba(79, 110, 247, 0.25);
      }
      .btn-submit:hover {
        background: var(--accent-hover);
        box-shadow: 0 4px 16px rgba(79, 110, 247, 0.35);
      }
      .btn-submit:active {
        transform: scale(0.99);
      }

      /* ── 하단 링크 ── */
      .card-footer {
        text-align: center;
        margin-top: 22px;
        font-size: 13px;
        color: var(--text-muted);
      }
      .card-footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .card-footer a:hover {
        text-decoration: underline;
      }

      /* ── 서버 에러 알림 ── */
      .alert {
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .alert-error {
        background: var(--danger-soft);
        border: 1px solid rgba(232, 69, 69, 0.25);
        color: var(--danger);
      }

      @media (max-width: 520px) {
        .card {
          padding: 28px 20px 24px;
        }
        .nav-bar {
          padding: 0 12px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="nav-bar">
      <a class="nav-logo" href="javascript:location.reload()"
        >✦ <span>My Blog</span></a
      >
      <button class="theme-toggle" id="themeToggle" title="다크모드 전환">
        🌙
      </button>
    </nav>

    <div class="page-body">
      <div class="card">
        <div class="card-header">
          <span class="icon">📝</span>
          <h1>회원가입</h1>
          <p>아래 정보를 입력하여 계정을 만드세요.</p>
        </div>

        <div
          class="alert alert-error"
          th:if="${errorMessage}"
          th:text="${errorMessage}"
        ></div>

        <form th:action="@{/user/signup}" method="post" id="signupForm">
          <div class="form-group">
            <label class="form-label" for="userId"
              >아이디 <span class="required">*</span></label
            >
            <div class="input-wrap">
              <span class="input-icon">👤</span>
              <input
                type="text"
                id="userId"
                name="userId"
                class="form-input"
                placeholder="아이디 입력"
                autocomplete="username"
                maxlength="20"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="userPassword"
              >비밀번호 <span class="required">*</span></label
            >
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                id="userPassword"
                name="userPassword"
                class="form-input"
                placeholder="비밀번호 입력"
                autocomplete="new-password"
                maxlength="64"
                required
              />
              <button type="button" class="toggle-pw" id="togglePw">👁️</button>
            </div>
            <div class="pw-strength" id="pwStrength">
              <div class="pw-strength-bar">
                <div class="pw-strength-fill" id="pwStrengthFill"></div>
              </div>
              <span class="pw-strength-label" id="pwStrengthLabel"
                >강도: -</span
              >
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="passwordConfirm"
              >비밀번호 확인 <span class="required">*</span></label
            >
            <div class="input-wrap">
              <span class="input-icon">🔑</span>
              <input
                type="password"
                id="passwordConfirm"
                name="passwordConfirm"
                class="form-input"
                placeholder="비밀번호 재입력"
                autocomplete="new-password"
                maxlength="64"
                required
              />
              <button type="button" class="toggle-pw" id="togglePwConfirm">
                👁️
              </button>
            </div>
          </div>

          <div class="divider"></div>

          <div class="form-group">
            <label class="form-label" for="userName"
              >이름 <span class="required">*</span></label
            >
            <div class="input-wrap">
              <span class="input-icon">🙍</span>
              <input
                type="text"
                id="userName"
                name="userName"
                class="form-input"
                placeholder="실명 또는 닉네임"
                autocomplete="name"
                maxlength="20"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="userEmail"
              >이메일 <span class="required">*</span></label
            >
            <div class="input-wrap">
              <span class="input-icon">✉️</span>
              <input
                type="email"
                id="userEmail"
                name="userEmail"
                class="form-input"
                placeholder="example@email.com"
                autocomplete="email"
                maxlength="100"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            가입하기
          </button>
        </form>

        <div class="card-footer">
          이미 계정이 있으신가요? <a th:href="@{/loginRedirect}">로그인</a>
        </div>
      </div>
    </div>

    <script>
      /* ── 다크모드 ── */
      const toggleBtn = document.getElementById("themeToggle");
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        toggleBtn.textContent = "☀️";
      }
      toggleBtn.addEventListener("click", () => {
        const isDark = document.body.classList.toggle("dark");
        toggleBtn.textContent = isDark ? "☀️" : "🌙";
        localStorage.setItem("theme", isDark ? "dark" : "light");
      });

      /* ── 비밀번호 보기 토글 ── */
      function makeToggle(btnId, inputId) {
        document.getElementById(btnId).addEventListener("click", () => {
          const input = document.getElementById(inputId);
          const isText = input.type === "text";
          input.type = isText ? "password" : "text";
          document.getElementById(btnId).textContent = isText ? "👁️" : "🙈";
        });
      }
      makeToggle("togglePw", "userPassword");
      makeToggle("togglePwConfirm", "passwordConfirm");

      /* ── 비밀번호 강도 실시간 표시 ── */
      const pwInput = document.getElementById("userPassword");
      const pwStrengthWrap = document.getElementById("pwStrength");
      const pwStrengthFill = document.getElementById("pwStrengthFill");
      const pwStrengthLabel = document.getElementById("pwStrengthLabel");

      pwInput.addEventListener("input", () => {
        const val = pwInput.value;
        if (!val) {
          pwStrengthWrap.classList.remove("visible");
          return;
        }
        pwStrengthWrap.classList.add("visible");
        let score = 0;
        if (val.length >= 8) score++;
        if (val.length >= 12) score++;
        if (/[A-Za-z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        const levels = [
          { label: "매우 약함", color: "#e84545", width: "20%" },
          { label: "약함", color: "#f97316", width: "40%" },
          { label: "보통", color: "#eab308", width: "60%" },
          { label: "강함", color: "#22c55e", width: "80%" },
          { label: "매우 강함", color: "#16a34a", width: "100%" },
        ];
        const level = levels[Math.min(score - 1, 4)] || levels[0];
        pwStrengthFill.style.width = level.width;
        pwStrengthFill.style.background = level.color;
        pwStrengthLabel.textContent = "강도: " + level.label;
      });
    </script>
  </body>
</html>
