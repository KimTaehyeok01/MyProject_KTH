<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>고차함수-reduce</title>
    <script>
      // reduce()함수 : 줄이다. 하나의 결과 값으로 반환. map()  => array
      let nums = [10, 20, 30, 40, 50];
      // 10 30 60 100
      // 배열의 총합을 반환값으로 받는 함수.
      // acc와 cur라는 인자를 받음(forEach와 map과는 다름)
      // acc(acccumulator):  누산기, 누적되는 값, 최종반환값
      // cur(current): 현재 아이템 값(현재 회차에 들어온 요소 값)
      // acc에 첫번째 값이 들어오고, cur에 두번째 요소값이 들어온다.
      let sum = nums.reduce((acc, cur) => {
        console.log(acc, cur);
        return acc + cur;
      });
      console.log("sum:", sum);
      //   //반복문
      //   let sum = 0;
      //   sum += sum + n;

      sum = nums.reduce((acc, cur) => {
        console.log(acc, cur);
        return acc + cur;
      }, 0); // 두번째 매개변수로 acc의 초기값을 설정 가능

      sum = nums.reduce((acc, cur, index, arr) => {
        console.log(acc, cur, index, arr);
      }, 0);

      //최대값 구하기
      let max = nums.reduce((acc, cur) => {
        return cur > acc ? cur : acc;
      }, 0);
      console.log(max);

      // 알파벳 갯수 구하기
      const alphabets = ["a", "b", "C", "c", "c"];
      // 결과값 {a:2,c:3}
      // acc의 초기값은 빈 객체로 설정한다.
      let obj_count = alphabets.reduce((acc, cur) => {
        // 첫회 : acc{}, cur "a"
        // acc['a']에 값이 있는가? null인가?
        if (acc[cur]) {
          // if(acc[cur])는 acc[cur] == null,undefined,Nan이냐와 같은 뜻
          // {a:} 값이 있네?
          acc[cur] += 1;
        } else {
          // {a:} 값이 엾네? null,undefined에는 +연산이 안되서 초기값1을 줌.
          acc[cur] = 1;
        }
        console.log(acc);
        return acc;
      }, {});

      // 자바스크립트에서 null체크(유효값)하는 방법
      let a = null; //NaN, null
      if (a) {
        console.log("값 있음");
      } else {
        console.log("값 없음");
      }
    </script>
  </head>
  <body></body>
</html>
