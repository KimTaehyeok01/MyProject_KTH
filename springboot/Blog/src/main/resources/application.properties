spring.application.name=Blog

# Server Port
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false

# JPA / Hibernate Settings
# \uD0DC\uD601\uB2D8\uC774 \uC694\uCCAD\uD558\uC2E0 \uB300\uB85C update \uC124\uC815 \uC720\uC9C0 (\uD14C\uC774\uBE14 \uC790\uB3D9 \uC0DD\uC131/\uC218\uC815)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# [\uC124\uC815] \uC790\uBC14\uC758 \uCE74\uBA5C\uCF00\uC774\uC2A4(userEmail)\uB97C DB\uC758 \uC2A4\uB124\uC774\uD06C\uCF00\uC774\uC2A4(user_email)\uB85C \uC790\uB3D9 \uBCC0\uD658 \uBC29\uC9C0
# (\uD0DC\uD601\uB2D8\uC758 \uAE30\uC874 \uC124\uC815 \uC720\uC9C0: \uC790\uBC14 \uD544\uB4DC\uBA85 \uADF8\uB300\uB85C DB \uCEEC\uB7FC \uC0DD\uC131)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# [\uC124\uC815] \uAE30\uBCF8 \uC2A4\uD0A4\uB9C8 \uC9C0\uC815 (MySQL\uC5D0 blog \uB370\uC774\uD130\uBCA0\uC774\uC2A4\uAC00 \uC788\uC5B4\uC57C \uD568)
spring.jpa.properties.hibernate.default_schema=blog

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Datasource Settings
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# [\uC5F0\uACB0] DB \uC8FC\uC18C \uBC0F \uC778\uCF54\uB529 \uC124\uC815
spring.datasource.url=jdbc:mysql://localhost:3306/blog?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=gkeptm20010030

# Logging
# \uCF58\uC194\uC5D0 SQL \uB85C\uADF8\uB97C \uC0C1\uC138\uD558\uAC8C \uCC0D\uC5B4\uC8FC\uB294 \uC124\uC815
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.output.ansi.enabled=always
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}