<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student CRUD Admin</title>
    <style>
        :root {
            --bg: #f3f0ea;
            --surface: #fffdf9;
            --surface-soft: #f8f4ed;
            --ink: #1d1a16;
            --muted: #665f54;
            --line: #ddd1c2;
            --teal: #0f6f6d;
            --orange: #b45a37;
            --blue: #2454a6;
            --danger: #a43838;
            --shadow: 0 18px 35px rgba(30, 24, 15, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
            color: var(--ink);
            min-height: 100vh;
            background:
                radial-gradient(circle at 12% 8%, rgba(15, 111, 109, 0.13), transparent 34%),
                radial-gradient(circle at 92% 92%, rgba(180, 90, 55, 0.12), transparent 28%),
                linear-gradient(145deg, #f8f5ef, var(--bg));
            padding: 30px 18px 44px;
        }

        .wrap {
            width: min(1180px, 100%);
            margin: 0 auto;
        }

        .top {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
        }

        .title {
            margin: 0;
            font-size: clamp(1.75rem, 2.7vw, 2.5rem);
            letter-spacing: -0.02em;
        }

        .badge {
            background: linear-gradient(120deg, var(--teal), #2f8791);
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 999px;
            padding: 8px 12px;
        }

        .desc {
            margin: 10px 0 0;
            color: var(--muted);
            line-height: 1.55;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 18px;
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 1.12rem;
        }

        .layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 14px;
            margin-top: 16px;
        }

        .stack {
            display: grid;
            gap: 14px;
        }

        .grid {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .grid-2 {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #3d382f;
        }

        input, button {
            font: inherit;
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 9px 11px;
            background: #fff;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        input:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(15, 111, 109, 0.12);
        }

        .btn-row {
            margin-top: 11px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 9px 13px;
            cursor: pointer;
            font-weight: 700;
            color: #fff;
            transition: transform 0.12s ease, filter 0.18s ease;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.02);
        }

        .btn-main { background: var(--teal); }
        .btn-sub { background: var(--orange); }
        .btn-blue { background: var(--blue); }
        .btn-danger { background: var(--danger); }

        .status {
            margin-top: 14px;
            padding: 11px 12px;
            border-radius: 12px;
            background: var(--surface-soft);
            border: 1px solid var(--line);
            font-weight: 600;
        }

        .split-read {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .box {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface-soft);
            padding: 12px;
        }

        .box h3 {
            margin: 0 0 8px;
            font-size: 0.97rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.95rem;
        }

        th, td {
            border-bottom: 1px solid var(--line);
            text-align: left;
            padding: 10px 8px;
        }

        th {
            background: #f4eee3;
            font-size: 0.88rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .result {
            margin-top: 12px;
            background: #171613;
            color: #edf0ea;
            border-radius: 12px;
            padding: 14px;
            min-height: 180px;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .hint {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        @media (max-width: 980px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 820px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }

            .split-read {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 580px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <div>
            <h1 class="title">Student CRUD Control Room</h1>
            <p class="desc">조회는 전체조회/단건조회로 분리했습니다. 브라우저는 Spring API만 호출하고 Spring이 Python CRUD를 프록시합니다.</p>
        </div>
        <div class="badge">Spring 8080 -> Python 8000</div>
    </div>

    <div class="layout">
        <section class="card">
            <h2>학생 등록/수정/삭제</h2>
            <div class="grid">
                <div>
                    <label for="studentId">student_id</label>
                    <input id="studentId" placeholder="예: 1004">
                </div>
                <div>
                    <label for="name">name</label>
                    <input id="name" placeholder="예: kim">
                </div>
                <div>
                    <label for="grade">grade</label>
                    <input id="grade" type="number" min="1" value="2">
                </div>
                <div>
                    <label for="age">age</label>
                    <input id="age" type="number" min="1" value="20">
                </div>
            </div>

            <div class="btn-row">
                <button class="btn-main" id="createBtn">등록 POST</button>
                <button class="btn-sub" id="updateBtn">수정 PUT</button>
                <button class="btn-danger" id="deleteBtn">삭제 DELETE</button>
            </div>
            <p class="hint">등록은 student_id 포함, 수정은 student_id 경로 + name/grade/age 본문으로 전송됩니다.</p>
        </section>

        <section class="card stack">
            <h2>조회</h2>
            <div class="split-read">
                <div class="box">
                    <h3>전체조회</h3>
                    <label for="searchQ">검색어(선택)</label>
                    <input id="searchQ" placeholder="예: kim 또는 1004">
                    <div class="btn-row">
                        <button class="btn-blue" id="listBtn">전체조회 GET</button>
                    </div>
                </div>
                <div class="box">
                    <h3>단건조회</h3>
                    <label for="readOneId">student_id</label>
                    <input id="readOneId" placeholder="예: 1004">
                    <div class="btn-row">
                        <button class="btn-main" id="readOneBtn">단건조회 GET</button>
                    </div>
                </div>
            </div>

            <div class="status" id="statusBox">준비됨</div>
            <table>
                <thead>
                <tr>
                    <th>student_id</th>
                    <th>name</th>
                    <th>grade</th>
                    <th>age</th>
                </tr>
                </thead>
                <tbody id="studentTbody"></tbody>
            </table>
        </section>
    </div>

    <section class="card">
        <h2>응답 로그</h2>
        <pre class="result" id="result">결과가 여기에 표시됩니다.</pre>
    </section>
</div>

<script>
    const studentIdEl = document.getElementById('studentId');
    const nameEl = document.getElementById('name');
    const gradeEl = document.getElementById('grade');
    const ageEl = document.getElementById('age');
    const searchQEl = document.getElementById('searchQ');
    const readOneIdEl = document.getElementById('readOneId');
    const statusBox = document.getElementById('statusBox');
    const resultEl = document.getElementById('result');
    const tbody = document.getElementById('studentTbody');

    function setStatus(text, ok = true) {
        statusBox.textContent = text;
        statusBox.style.color = ok ? '#0d6a6a' : '#af2f2f';
    }

    function getPayload(includeStudentId) {
        const payload = {
            name: nameEl.value.trim(),
            grade: Number(gradeEl.value),
            age: Number(ageEl.value)
        };
        if (includeStudentId) {
            payload.student_id = studentIdEl.value.trim();
        }
        return payload;
    }

    async function requestJson(url, options = {}) {
        const response = await fetch(url, options);
        const text = await response.text();
        let parsed;
        try {
            parsed = text ? JSON.parse(text) : null;
        } catch (e) {
            parsed = text;
        }
        resultEl.textContent = JSON.stringify({
            status: response.status,
            body: parsed
        }, null, 2);
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        return parsed;
    }

    function normalizeRows(data) {
        if (!data) {
            return [];
        }
        return Array.isArray(data) ? data : [data];
    }

    function renderRows(rows) {
        tbody.innerHTML = '';
        if (!rows.length) {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td colspan="4">조회된 데이터가 없습니다.</td>';
            tbody.appendChild(tr);
            return;
        }
        rows.forEach((row) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.student_id ?? row.id ?? ''}</td>
                <td>${row.name ?? ''}</td>
                <td>${row.grade ?? ''}</td>
                <td>${row.age ?? ''}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function refreshList() {
        try {
            const keyword = searchQEl.value.trim();
            const url = keyword
                ? '/api/students?q=' + encodeURIComponent(keyword)
                : '/api/students';
            const list = await requestJson(url);
            renderRows(normalizeRows(list));
            setStatus('목록 조회 성공');
        } catch (error) {
            setStatus('목록 조회 실패: ' + error.message, false);
        }
    }

    async function readOneStudent() {
        const studentId = readOneIdEl.value.trim();
        if (!studentId) {
            setStatus('단건 조회 실패: student_id를 입력하세요.', false);
            return;
        }
        try {
            const student = await requestJson('/api/students/' + encodeURIComponent(studentId));
            renderRows(normalizeRows(student));
            setStatus('단건 조회 성공');
        } catch (error) {
            setStatus('단건 조회 실패: ' + error.message, false);
        }
    }

    async function createStudent() {
        try {
            const payload = getPayload(true);
            await requestJson('/api/students', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            setStatus('등록 성공');
            await refreshList();
        } catch (error) {
            setStatus('등록 실패: ' + error.message, false);
        }
    }

    async function updateStudent() {
        const studentId = studentIdEl.value.trim();
        if (!studentId) {
            setStatus('수정 실패: student_id를 입력하세요.', false);
            return;
        }
        try {
            const payload = getPayload(false);
            await requestJson('/api/students/' + encodeURIComponent(studentId), {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            setStatus('수정 성공');
            await refreshList();
        } catch (error) {
            setStatus('수정 실패: ' + error.message, false);
        }
    }

    async function deleteStudent() {
        const studentId = studentIdEl.value.trim();
        if (!studentId) {
            setStatus('삭제 실패: student_id를 입력하세요.', false);
            return;
        }
        try {
            await requestJson('/api/students/' + encodeURIComponent(studentId), {
                method: 'DELETE'
            });
            setStatus('삭제 성공');
            await refreshList();
        } catch (error) {
            setStatus('삭제 실패: ' + error.message, false);
        }
    }

    document.getElementById('createBtn').addEventListener('click', createStudent);
    document.getElementById('updateBtn').addEventListener('click', updateStudent);
    document.getElementById('deleteBtn').addEventListener('click', deleteStudent);
    document.getElementById('listBtn').addEventListener('click', refreshList);
    document.getElementById('readOneBtn').addEventListener('click', readOneStudent);

    refreshList();
</script>
</body>
</html>
