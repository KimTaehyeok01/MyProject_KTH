<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>로그인</title>
    <style>
      .login-card {
        width: 350px;
        margin: 100px auto;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
        box-sizing: border-box;
      }
      .btn-login {
        background-color: #4c7cf5;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1>Login</h1>
      <form th:action="@{/loginAction}" method="post">
        <div class="input-group">
          <input
            type="text"
            name="memberUserName"
            placeholder="아이디"
            required
          />
        </div>
        <div class="input-group">
          <input
            type="password"
            name="memberPassword"
            placeholder="비밀번호"
            required
          />
        </div>
        <div class="btn-group">
          <button type="submit" class="btn-login">로그인</button>
          <br />
          <br />
          <a
            th:href="@{/joinForm}"
            style="text-decoration: none; color: #666; font-size: 13px"
            >회원가입 하러가기</a
          >
        </div>
      </form>
    </div>
  </body>
</html>
