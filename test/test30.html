<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>JS Advanced Practice</title>
    <script>
      /*
        [심화 문제: 전사적 백엔드 개발자 찾기]
        1. 목표:
           - 모든 부서(departments)를 통합하여 'Backend' 직무를 가진 사람의 이름만 추출하세요.
        2. 조건:
           - 배열 안에 배열이 있는 구조(members)를 잘 다뤄야 합니다.
           - 최종 결과는 1차원 배열 ["이름", "이름"] 형태여야 합니다.
      */

      const departments = [
        {
          deptName: "기획팀",
          members: [
            { name: "김기획", role: "Planner" },
            { name: "이기획", role: "Planner" },
          ],
        },
        {
          deptName: "개발팀",
          members: [
            { name: "박프론트", role: "Frontend" },
            { name: "최백엔드", role: "Backend" },
            { name: "정풀스택", role: "Backend" },
          ],
        },
        {
          deptName: "운영팀",
          members: [
            { name: "강운영", role: "Operator" },
            { name: "조백엔드", role: "Backend" },
          ],
        },
      ];

      const buseo = (backend) => backend.role == "Backend";

      const main = (func) =>
        (result = departments
          .flatMap((dept) => dept.members)
          .filter((lists) => func(lists))
          .map((list) => {
            return list.name;
          }));

      main(buseo);
      console.log(result);
    </script>
  </head>
  <body></body>
</html>
