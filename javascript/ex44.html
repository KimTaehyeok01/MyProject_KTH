<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배열의 다양한 선언 방법</title>
    <script>
      // 1. 배열 선언 방법 : 대괄호 사용
      let nums1 = [10, 20, 30]; // 총 3개 아이템의 배열(리스트) 선언
      console.log(nums1.length); // 배열의 길이
      let nums2 = []; // 빈 배열 - 길이 : 0
      console.log(nums2.length); // 배열의 길이

      // 1. push()함수 -> 베열의 마지막에 아이템을 추가하는 함수.
      // 2. index에 데이터 넣기(비추!)
      nums2.push(10); //0  // 1번 방법
      nums2.push(20); //1
      nums2.push(30); //2
      nums2[3] = 40; // undefined타입에 데이터 초기화.  // 2번 방법.
      console.log(nums2);
      // 순회
      for (let i = 0; i < nums2.length; i++) {
        console.log(nums2[i]); // 반복변수 i가 배열의 index역할을 한다.
      }

      // pop()함수 -> 배열의 마지막에 아이템을 삭제하는 함수.

      // 2. 배열 선언 방법 : Array() 객체선언 이용
      // 객체(object) - 클래스(함수 + 변수)를 new(메모리적재)하면 객체가 된다.
      // 클래스는 모두 첫번째 문자가 대문자다.
      let arr = new Array(); // 클래스 이름 옆에 () 하면 객체가 생성된다 : 생성자 함수
      // let arr = [];
      arr.push("바나나", "망고", "오렌지");
      console.log(arr);

      let arr2 = new Array(5); // index 길이가 5.
      // 그래서 array.of라는 대안이 나옴. array.of(5)는 인덱스가 아닌 값이 5임.
      console.log(arr2.length);
      console.log(arr2); // empty가 5.
      console.log(arr2[0]); // undefined. undefined로 5개로 채워졌다고 볼 수 있음.

      let arr3 = new Array(10, 20, 30);
      console.log(arr3);
      console.log(arr3[2]);
      let arr4 = new Array("홍길동", "이몽룡", "전우치");
      console.log(arr4);

      // 3. 배열 선언 방법 : Array.of() 함수 이용 - 값 자체를 배열로 만들 때

      const array3 = Array.of(70, 80, 90);
      console.log("Array 3:", array3);
      let arr5 = Array.of(5); // array 아이템이 5.
      let arr6 = Array.of(arr4); // 길이가 1인 배열 생성.(배열을 그대로 복사하는 from과는 다르다.)
      console.log("길이:", arr6.length);

      // 4. 배열 선언 방법 : Array.from() 함수 이용 - 배열을 복사할 때 주로 사용.
      let arr8 = Array.from(arr4); // 다른 배열을 복사할 수 있다. from만이 완전히 복사.
      console.log("길이:", arr8.length);

      // 유사 배열 : 문자열, 집합, 매핑함수
      let arr9 = Array.from("hello");
      console.log(arr9);

      // 집합 : Set(중복을 허용하지 않는 유일한 값들의 집합을 말함)중복제거 함수
      let arr10 = Array.from(new Set([1, 1, 2, 3]));
      console.log(arr10); // [1, 2, 3]

      // 매핑함수
      let arr11 = Array.from([1, 2, 3], (x) => x * 2);
      console.log(arr11); // [2, 4, 6]

      // 연습문제
      /*
            2-gram이란 문자열에서 2개의 연속된 요소를 출력하는 방법입니다.
            예를 들어 'Javascript'를 2-gram으로 반복해 본다면 다음과 같은 결과가 나옵니다.
            입력으로 문자열이 주어지면 2-gram으로 출력하는 프로그램을 작성해 주세요.*/

      let gram = "Javascript"; //10

      for (let i = 0; i < gram.length - 1; i++) {
        console.log(gram[i], gram[i + 1]);
      }
    </script>
  </head>
  <body></body>
</html>
