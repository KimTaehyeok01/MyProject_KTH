<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대출/반납</title>
    <style>
      :root {
        --bg: #f0f4f8;
        --surface: #fff;
        --surface-alt: #f8f9fa;
        --border: #e2e8f0;
        --text-primary: #1a202c;
        --text-secondary: #4a5568;
        --text-muted: #9399a6;
        --primary: #1e3a5f;
        --primary-light: #2d5a8e;
        --primary-soft: #e8f0f8;
        --accent: #e8a020;
        --accent-soft: #fef3e0;
        --danger: #e84545;
        --danger-soft: #fdf0f0;
        --success: #22c55e;
        --success-soft: #f0fdf4;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.07);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
        --radius: 12px;
        --radius-sm: 8px;
        --transition: 0.18s ease;
      }
      body.dark {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface-alt: #22263a;
        --border: #2e3347;
        --text-primary: #e8eaf0;
        --text-secondary: #9399a6;
        --text-muted: #5c6370;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100vh;
      }
      .nav-bar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0 28px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: var(--shadow-sm);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .nav-logo {
        font-size: 20px;
        font-weight: 800;
        color: var(--primary);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .nav-logo span {
        color: var(--text-primary);
      }
      .nav-center {
        display: flex;
        gap: 4px;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }
      .nav-link {
        padding: 6px 14px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        color: var(--text-secondary);
        transition: all var(--transition);
      }
      .nav-link:hover,
      .nav-link.active {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .nav-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .nav-user-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 5px 14px;
        font-size: 13px;
        font-weight: 600;
      }
      .btn-nav {
        padding: 7px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-secondary);
        transition: all var(--transition);
      }
      .btn-nav:hover {
        background: var(--surface-alt);
      }
      .btn-nav-admin {
        background: var(--accent-soft);
        color: var(--accent);
        border-color: var(--accent);
        font-size: 12px;
      }
      .theme-toggle {
        width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-alt);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }
      /* 레이아웃 */
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 16px 60px;
      }
      .page-title {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .layout-grid {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 24px;
      }
      @media (max-width: 900px) {
        .layout-grid {
          grid-template-columns: 1fr;
        }
      }
      /* 검색 */
      .search-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .search-bar input {
        flex: 1;
        padding: 11px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 14px;
        background: var(--surface);
        color: var(--text-primary);
        outline: none;
      }
      .search-bar input:focus {
        border-color: var(--primary);
      }
      .search-bar button {
        padding: 11px 22px;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      /* 카드 */
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }
      .panel-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .panel-header h3 {
        font-size: 15px;
        font-weight: 700;
      }
      .panel-badge {
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 12px;
        font-weight: 700;
        padding: 3px 12px;
        border-radius: 12px;
      }
      /* 도서 테이블 */
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        padding: 11px 16px;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-muted);
        background: var(--surface-alt);
        text-align: center;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 12px 16px;
        font-size: 13px;
        color: var(--text-primary);
        border-bottom: 1px solid var(--border);
        text-align: center;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .status-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 700;
      }
      .status-ok {
        background: var(--success-soft);
        color: var(--success);
      }
      .status-no {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .btn-action {
        padding: 6px 14px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition: all var(--transition);
      }
      .btn-loan-sm {
        background: var(--primary);
        color: #fff;
      }
      .btn-loan-sm:hover {
        background: var(--primary-light);
      }
      .btn-loan-sm:disabled {
        background: var(--border);
        color: var(--text-muted);
        cursor: not-allowed;
      }
      .btn-return-sm {
        background: var(--accent);
        color: #fff;
      }
      .btn-return-sm:hover {
        background: #d4901c;
      }
      /* 내 대출 목록 */
      .loan-item {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .loan-item:last-child {
        border-bottom: none;
      }
      .loan-title {
        font-size: 14px;
        font-weight: 700;
      }
      .loan-meta {
        font-size: 12px;
        color: var(--text-secondary);
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .loan-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 4px;
      }
      .overdue-badge {
        background: var(--danger-soft);
        color: var(--danger);
        font-size: 11px;
        font-weight: 700;
        padding: 2px 10px;
        border-radius: 12px;
      }
      .active-badge {
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 11px;
        font-weight: 700;
        padding: 2px 10px;
        border-radius: 12px;
      }
      .empty-msg {
        padding: 40px;
        text-align: center;
        color: var(--text-muted);
        font-size: 14px;
      }
      /* 페이지네이션 */
      .pagination-wrap {
        display: flex;
        justify-content: center;
        padding: 16px;
      }
      .pagination {
        display: flex;
        list-style: none;
        gap: 4px;
      }
      .page-link {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 34px;
        height: 34px;
        text-decoration: none;
        color: var(--text-secondary);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 13px;
      }
      .page-item.active .page-link {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }
      .page-item.disabled .page-link {
        opacity: 0.4;
        pointer-events: none;
      }
      .toast {
        position: fixed;
        bottom: 28px;
        right: 28px;
        z-index: 999;
        background: var(--primary);
        color: #fff;
        padding: 14px 22px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
        transform: translateY(80px);
        opacity: 0;
        transition: all 0.3s ease;
        pointer-events: none;
      }
      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <nav class="nav-bar">
      <a class="nav-logo" th:href="@{/}">📚 <span>행복도서관</span></a>
      <div class="nav-center">
        <a class="nav-link" th:href="@{/}">메인</a>
        <a class="nav-link active" th:href="@{/loan}">대출/반납</a>
      </div>
      <div class="nav-actions">
        <div class="nav-user-chip">
          👤
          <span
            th:text="${session.userName != null ? session.userName : #authentication.name}"
            >사용자</span
          >
        </div>
        <a
          class="btn-nav btn-nav-admin"
          th:href="@{/admin}"
          sec:authorize="hasRole('ADMIN')"
          >⚙ 관리자</a
        >
        <a class="btn-nav" th:href="@{/mypage}">마이페이지</a>
        <form
          th:action="@{/logoutAction}"
          method="post"
          style="display: inline"
        >
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />
          <button type="submit" class="btn-nav">로그아웃</button>
        </form>
        <button class="theme-toggle" id="themeToggle">🌙</button>
      </div>
    </nav>

    <div class="wrap">
      <div class="page-title">📚 대출 / 반납</div>

      <div class="layout-grid">
        <!-- 왼쪽: 도서 검색 + 대출 -->
        <div>
          <form class="search-bar" th:action="@{/loan}" method="get">
            <input
              type="text"
              name="keyword"
              th:value="${keyword}"
              placeholder="도서명 또는 저자를 검색하세요..."
            />
            <button type="submit">🔍 검색</button>
          </form>

          <div class="panel">
            <div class="panel-header">
              <h3>📖 도서 목록</h3>
              <span class="panel-badge" th:text="${paging.totalElements} + '권'"
                >0권</span
              >
            </div>
            <table>
              <thead>
                <tr>
                  <th>도서명</th>
                  <th>저자</th>
                  <th>카테고리</th>
                  <th>가용</th>
                  <th>대출</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="book : ${paging.content}">
                  <td style="text-align: left" th:text="${book.title}">
                    도서명
                  </td>
                  <td th:text="${book.author}">저자</td>
                  <td th:text="${book.category}">카테고리</td>
                  <td>
                    <span
                      class="status-badge"
                      th:classappend="${book.availableQuantity > 0} ? 'status-ok' : 'status-no'"
                      th:text="${book.availableQuantity} + '/' + ${book.totalQuantity}"
                      >0/0</span
                    >
                  </td>
                  <td>
                    <button
                      class="btn-action btn-loan-sm"
                      th:disabled="${book.availableQuantity <= 0}"
                      th:attr="data-book-id=${book.id}, data-book-title=${book.title}"
                      onclick="loanBook(this)"
                    >
                      대출
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
            <div class="empty-msg" th:if="${paging.isEmpty()}">
              📭 검색 결과가 없습니다.
            </div>
            <!-- 페이지네이션 -->
            <div class="pagination-wrap" th:if="${!paging.isEmpty()}">
              <ul class="pagination">
                <li
                  class="page-item"
                  th:classappend="${!paging.hasPrevious} ? 'disabled'"
                >
                  <a
                    class="page-link"
                    th:href="@{/loan(keyword=${keyword}, page=${paging.number - 1})}"
                    >‹</a
                  >
                </li>
                <li
                  class="page-item"
                  th:each="p : ${#numbers.sequence(0, paging.totalPages - 1)}"
                  th:if="${p >= paging.number - 2 and p <= paging.number + 2}"
                  th:classappend="${p == paging.number} ? 'active'"
                >
                  <a
                    class="page-link"
                    th:text="${p + 1}"
                    th:href="@{/loan(keyword=${keyword}, page=${p})}"
                  ></a>
                </li>
                <li
                  class="page-item"
                  th:classappend="${!paging.hasNext} ? 'disabled'"
                >
                  <a
                    class="page-link"
                    th:href="@{/loan(keyword=${keyword}, page=${paging.number + 1})}"
                    >›</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </div>

        <!-- 오른쪽: 내 대출 현황 -->
        <div>
          <div class="panel">
            <div class="panel-header">
              <h3>📋 내 대출 현황</h3>
              <span
                class="panel-badge"
                th:text="${activeLoans.size()} + '권 대출중'"
                >0권</span
              >
            </div>

            <div th:if="${!activeLoans.isEmpty()}">
              <div class="loan-item" th:each="loan : ${activeLoans}">
                <div class="loan-title" th:text="${loan.bookTitle}">도서명</div>
                <div class="loan-meta">
                  <span th:text="'저자: ' + ${loan.bookAuthor}">저자</span>
                  <span th:text="'대출일: ' + ${loan.loanDate}">대출일</span>
                </div>
                <div class="loan-footer">
                  <span
                    th:text="'반납예정: ' + ${loan.expectedReturnDate}"
                    style="font-size: 12px; color: var(--text-muted)"
                    >반납예정일</span
                  >
                  <div style="display: flex; align-items: center; gap: 8px">
                    <span th:if="${loan.overdue}" class="overdue-badge"
                      >연체!</span
                    >
                    <span th:unless="${loan.overdue}" class="active-badge"
                      >대출중</span
                    >
                    <button
                      class="btn-action btn-return-sm"
                      th:attr="data-loan-id=${loan.id}"
                      onclick="returnBook(this)"
                    >
                      반납
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div class="empty-msg" th:if="${activeLoans.isEmpty()}">
              📭 현재 대출 중인 도서가 없습니다.
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script th:inline="javascript">
      function getCsrfToken() {
        const match = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
        return match ? decodeURIComponent(match[1]) : "";
      }
      function showToast(msg, type) {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.style.background = type === "error" ? "#e84545" : "#1e3a5f";
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
      }
      function loanBook(btn) {
        const bookId = btn.getAttribute("data-book-id");
        const bookTitle = btn.getAttribute("data-book-title");
        if (!confirm('"' + bookTitle + '" 을(를) 대출하시겠습니까?')) return;
        fetch("/api/loan/" + bookId, {
          method: "POST",
          headers: { "X-XSRF-TOKEN": getCsrfToken() },
        })
          .then((res) => res.text())
          .then((result) => {
            if (result === "SUCCESS") {
              showToast("✅ 대출 완료!", "success");
              setTimeout(() => location.reload(), 1500);
            } else {
              showToast(
                "❌ " +
                  (result.startsWith("ERROR:") ? result.substring(6) : result),
                "error",
              );
            }
          })
          .catch(() => showToast("❌ 서버 오류", "error"));
      }
      function returnBook(btn) {
        const loanId = btn.getAttribute("data-loan-id");
        if (!confirm("반납하시겠습니까?")) return;
        fetch("/api/loan/return/" + loanId, {
          method: "POST",
          headers: { "X-XSRF-TOKEN": getCsrfToken() },
        })
          .then((res) => res.text())
          .then((result) => {
            if (result === "SUCCESS") {
              showToast("✅ 반납 완료!", "success");
              setTimeout(() => location.reload(), 1500);
            } else {
              showToast(
                "❌ " +
                  (result.startsWith("ERROR:") ? result.substring(6) : result),
                "error",
              );
            }
          })
          .catch(() => showToast("❌ 서버 오류", "error"));
      }
      const toggleBtn = document.getElementById("themeToggle");
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        toggleBtn.textContent = "☀️";
      }
      toggleBtn.addEventListener("click", () => {
        const isDark = document.body.classList.toggle("dark");
        toggleBtn.textContent = isDark ? "☀️" : "🌙";
        localStorage.setItem("theme", isDark ? "dark" : "light");
      });
    </script>
  </body>
</html>
