<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta id="jwt-token" th:content="${jwtToken}"/>
    <title>마이페이지 - 도서관</title>
    <style>
        :root {
            --bg:#f0f4f8; --surface:#fff; --surface-alt:#f8f9fa; --border:#e2e8f0;
            --text-primary:#1a202c; --text-secondary:#4a5568; --text-muted:#9399a6;
            --primary:#1e3a5f; --primary-light:#2d5a8e; --primary-soft:#e8f0f8;
            --accent:#e8a020; --accent-soft:#fef3e0;
            --danger:#e84545; --danger-soft:#fdf0f0;
            --success:#22c55e; --success-soft:#f0fdf4;
            --shadow-sm:0 1px 3px rgba(0,0,0,0.07); --shadow-md:0 4px 16px rgba(0,0,0,0.08);
            --radius:12px; --radius-sm:8px; --transition:0.18s ease;
        }
        body.dark {
            --bg:#0f1117; --surface:#1a1d27; --surface-alt:#22263a; --border:#2e3347;
            --text-primary:#e8eaf0; --text-secondary:#9399a6; --text-muted:#5c6370;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI','Noto Sans KR',Arial,sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;}
        .nav-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-sm);position:sticky;top:0;z-index:100;}
        .nav-logo{font-size:20px;font-weight:800;color:var(--primary);text-decoration:none;display:flex;align-items:center;gap:8px;}
        .nav-logo span{color:var(--text-primary);}
        .nav-actions{display:flex;align-items:center;gap:8px;}
        .nav-user-chip{display:flex;align-items:center;gap:6px;background:var(--surface-alt);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:600;}
        .btn-nav{padding:7px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);transition:all var(--transition);}
        .btn-nav:hover{background:var(--surface-alt);}
        .btn-nav-admin{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-size:12px;}
        .theme-toggle{width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-alt);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;}
        .wrap{max-width:900px;margin:0 auto;padding:36px 16px 60px;}
        .page-title{font-size:24px;font-weight:800;margin-bottom:28px;display:flex;align-items:center;gap:10px;}
        /* 유저 카드 */
        .user-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow-sm);margin-bottom:28px;display:flex;align-items:center;gap:20px;}
        .user-avatar{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;flex-shrink:0;}
        .user-info h3{font-size:20px;font-weight:700;margin-bottom:4px;}
        .user-info p{font-size:14px;color:var(--text-secondary);}
        .user-stats{margin-left:auto;display:flex;gap:20px;}
        .stat-box{text-align:center;background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 20px;}
        .stat-num{font-size:24px;font-weight:800;color:var(--primary);}
        .stat-label{font-size:12px;color:var(--text-muted);margin-top:2px;}
        /* 섹션 */
        .section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:24px;overflow:hidden;}
        .section-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
        .section-header h3{font-size:16px;font-weight:700;}
        .section-badge{background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700;padding:3px 12px;border-radius:12px;}
        table{width:100%;border-collapse:collapse;}
        th{padding:12px 20px;font-size:12px;font-weight:700;color:var(--text-muted);background:var(--surface-alt);text-align:center;border-bottom:1px solid var(--border);}
        td{padding:14px 20px;font-size:14px;color:var(--text-primary);border-bottom:1px solid var(--border);text-align:center;}
        td:last-child{border-bottom:none;}
        tr:last-child td{border-bottom:none;}
        .loan-status{display:inline-block;padding:3px 12px;border-radius:12px;font-size:12px;font-weight:700;}
        .status-borrowed{background:var(--primary-soft);color:var(--primary);}
        .status-returned{background:var(--success-soft);color:var(--success);}
        .status-overdue{background:var(--danger-soft);color:var(--danger);}
        .btn-return{padding:6px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;border:none;cursor:pointer;background:var(--accent);color:#fff;transition:all var(--transition);}
        .btn-return:hover{background:#d4901c;}
        .empty-msg{padding:40px;text-align:center;color:var(--text-muted);font-size:15px;}
        .toast{position:fixed;bottom:28px;right:28px;z-index:999;background:var(--primary);color:#fff;padding:14px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,0.25);transform:translateY(80px);opacity:0;transition:all 0.3s ease;pointer-events:none;}
        .toast.show{transform:translateY(0);opacity:1;}
    </style>
</head>
<body>
<nav class="nav-bar">
    <a class="nav-logo" th:href="@{/}">📚 <span>도서관</span></a>
    <div class="nav-actions">
        <div class="nav-user-chip">👤 <span th:text="${userName}">사용자</span></div>
        <a class="btn-nav btn-nav-admin" th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">⚙ 관리자</a>
        <a class="btn-nav" th:href="@{/loan}">대출/반납</a>
        <form th:action="@{/logoutAction}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-nav">로그아웃</button>
        </form>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>
</nav>

<div class="wrap">
    <div class="page-title">📋 마이페이지</div>

    <!-- 유저 정보 카드 -->
    <div class="user-card">
        <div class="user-avatar">👤</div>
        <div class="user-info">
            <h3 th:text="${userName}">사용자</h3>
            <p th:text="${userEmail}">이메일</p>
        </div>
        <div class="user-stats">
            <div class="stat-box">
                <div class="stat-num" th:text="${activeLoans.size()}">0</div>
                <div class="stat-label">대출 중</div>
            </div>
            <div class="stat-box">
                <div class="stat-num" th:text="${allLoans.size()}">0</div>
                <div class="stat-label">전체 이력</div>
            </div>
        </div>
    </div>

    <!-- 현재 대출 중인 도서 -->
    <div class="section-card">
        <div class="section-header">
            <h3>📖 현재 대출 중인 도서</h3>
            <span class="section-badge" th:text="${activeLoans.size()} + '권'">0권</span>
        </div>
        <table th:if="${!activeLoans.isEmpty()}">
            <thead>
            <tr>
                <th>도서명</th><th>저자</th><th>대출일</th><th>반납 예정일</th><th>상태</th><th>반납</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="loan : ${activeLoans}">
                <td th:text="${loan.bookTitle}">도서명</td>
                <td th:text="${loan.bookAuthor}">저자</td>
                <td th:text="${loan.loanDate}">대출일</td>
                <td th:text="${loan.expectedReturnDate}">반납예정일</td>
                <td>
                    <span th:if="${loan.overdue}" class="loan-status status-overdue">연체 중</span>
                    <span th:unless="${loan.overdue}" class="loan-status status-borrowed">대출 중</span>
                </td>
                <td>
                    <button class="btn-return"
                            th:attr="data-loan-id=${loan.id}"
                            onclick="returnBook(this)">반납</button>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty-msg" th:if="${activeLoans.isEmpty()}">
            📭 현재 대출 중인 도서가 없습니다.
        </div>
    </div>

    <!-- 전체 대출 이력 -->
    <div class="section-card">
        <div class="section-header">
            <h3>📜 전체 대출 이력</h3>
            <span class="section-badge" th:text="${allLoans.size()} + '건'">0건</span>
        </div>
        <table th:if="${!allLoans.isEmpty()}">
            <thead>
            <tr>
                <th>#</th><th>도서명</th><th>대출일</th><th>반납 예정일</th><th>반납일</th><th>상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="loan, stat : ${allLoans}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${loan.bookTitle}">도서명</td>
                <td th:text="${loan.loanDate}">대출일</td>
                <td th:text="${loan.expectedReturnDate}">반납예정일</td>
                <td th:text="${loan.returnDate != null ? loan.returnDate : '-'}">반납일</td>
                <td>
                    <span class="loan-status"
                          th:classappend="${loan.loanStatus.name() == 'BORROWED'} ? (${loan.overdue} ? 'status-overdue' : 'status-borrowed') : 'status-returned'"
                          th:text="${loan.loanStatusValue}">상태</span>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty-msg" th:if="${allLoans.isEmpty()}">
            📭 대출 이력이 없습니다.
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script th:inline="javascript">
    const JWT_TOKEN = document.getElementById('jwt-token')?.content;
    function getCsrfToken() {
        const match = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
        return match ? decodeURIComponent(match[1]) : '';
    }
    function showToast(msg, type) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = type === 'error' ? '#e84545' : '#1e3a5f';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
    function returnBook(btn) {
        const loanId = btn.getAttribute('data-loan-id');
        if (!confirm('반납하시겠습니까?')) return;
        fetch('/api/loan/return/' + loanId, {
            method: 'POST',
            headers: { 'X-XSRF-TOKEN': getCsrfToken(), 'JWT_TOKEN': JWT_TOKEN || '' }
        })
        .then(res => res.text())
        .then(result => {
            if (result === 'SUCCESS') {
                showToast('✅ 반납이 완료되었습니다!', 'success');
                setTimeout(() => location.reload(), 1500);
            } else {
                const msg = result.startsWith('ERROR:') ? result.substring(6) : '반납 처리 중 오류가 발생했습니다.';
                showToast('❌ ' + msg, 'error');
            }
        })
        .catch(() => showToast('❌ 서버 오류가 발생했습니다.', 'error'));
    }
    const toggleBtn = document.getElementById('themeToggle');
    if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark'); toggleBtn.textContent = '☀️'; }
    toggleBtn.addEventListener('click', () => {
        const isDark = document.body.classList.toggle('dark');
        toggleBtn.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
</script>
</body>
</html>
