<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입 화면</title>
  </head>
  <body>
    <h1>회원가입 화면</h1>

    <form
      th:action="@{/joinAction}"
      method="post"
      name="userInfo"
      onsubmit="return valid();"
    >
      <input
        type="hidden"
        th:name="${_csrf.parameterName}"
        th:value="${_csrf.token}"
      />
      <table border="1">
        <tr>
          <td>아이디</td>
          <td>
            <input type="text" name="username" id="username" maxlength="20" />
          </td>
        </tr>
        <tr>
          <td>비번</td>
          <td>
            <input type="text" name="password" id="password" maxlength="20" />
          </td>
        </tr>
        <tr>
          <td>이름</td>
          <td>
            <input type="text" name="nickName" id="nickName" maxlength="50" />
          </td>
        </tr>
        <tr>
          <td>가입일자</td>
          <td>
            <input type="date" name="joinDate" id="joinDate" />
          </td>
        </tr>

        <tr>
          <td>권한</td>
          <td>
            <select name="userRole" id="userRole" required>
              <option selected>권한을 선택해주세요</option>
              <option value="ROLE_USER" selected>회원</option>
              <option value="ROLE_ADMIN">관리자</option>
            </select>
          </td>
        </tr>

        <tr>
          <td colspan="2" align="center">
            <input type="submit" value="회원가입" />
          </td>
        </tr>
      </table>
    </form>

    <script>
      function valid() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const nickName = document.getElementById("nickName").value.trim();
        const joinDate = document.getElementById("joinDate").value;
        const userRole = document.getElementById("userRole").value;

        if (!username) {
          alert("아이디를 입력하세요.");
          return false;
        }

        if (!password) {
          alert("비밀반호를 입력하세요.");
          return false;
        }

        if (!nickName) {
          alert("이름을 입력하세요.");
          return false;
        }

        if (!joinDate) {
          alert("가입일자를 입력하세요.");
          return false;
        }

        if (!userRole) {
          alert("권한을 선택하세요.");
          return false;
        }

        return true;
      }
    </script>
  </body>
</html>
