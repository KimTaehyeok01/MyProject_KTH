<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>문자열 제어 함수들</title>
    <script>
      // 문자열 선언 방법1 - 리터럴
      let string1 = "문자열";
      console.log(typeof string1); // String타입 - 수정 불가

      // 문자열 선언 방법2 - String 객체
      let string2 = new String("문자열2");
      console.log(typeof string2); // object타입 - 수정 가능

      let string3 = "Abcdef";
      // 문자열 길이
      console.log(string3.length);
      // 대문자 변경 - 한 글자 세세하게 다루려면 아스키 코드로 변경
      console.log(string3.toUpperCase());
      // 소문자 변경 - String.fromCharCode(), charCodeAt()
      console.log(string3.toLowerCase());

      // 문자열에서 문자 한 자만 가져오기 - charAt()함수
      let char = string3.charAt(0); // let char2 = string3[0]; 같은 코드
      console.log(char);
      let char2 = string3[0];
      console.log(char2);

      // 문자나 문자열에 index 가져오기 - indexOf()함수
      let string4 = "java_script_programming";
      // "script" 문자열의 위치(인덱스)는?
      console.log(string4.indexOf("script"));
      // 못찾으면 -1을 내뱉음.
      console.log(string4.indexOf("python"));
      console.log(string4.indexOf("i")); // 첫번째 i 인덱스
      console.log(string4.lastIndexOf("i")); // 마지막 i 인덱스

      // 문자열 치환(교체) - replace("기존 것", "바꿀 것") 원본 훼손x(복사 개념)
      let replaced = string4.replace("java", "ECMA");
      console.log(string4);
      console.log(replaced);

      // 문자열 일부만 가져오기 substring(시작할 인덱스, 끝날 인덱스)함수. 원본 훼손x(복사 개념)
      // substring(start index, end index-1) 기본 공식임.
      let substr1 = string4.substring(5, 11);
      console.log(substr1);

      // 문자열 분리
      let string5 = "딸기, 배, 사과, 포도, 바나나";
      console.log(string5);
      let array = string5.split(",");
      console.log(array);

      // 문자열 연결 - concat()함수 :
      // 공식 -> 배열.concat(배열) let concated = string6.concat(string7);
      // 1. +연산자
      // 2. concat()함수
      let string6 = "ECMA";
      let string7 = "scrpit";
      let concated = string6.concat(string7);
      console.log(concated);

      // 공백 제거 - 좌우 공백 제거(통신 응답 문자열에 공백 제거)
      let string8 = " This is java script";
      console.log(string8.trim());

      // 공백 제거 - 좌우 공백 + 가운데 공백까지
      // ex) 폰번호: 010 12 34 5678
      // 정규 표현식(Regular Expression)
      let fullTrim = string8.replace(/(|s*)/g, "");
      console.log(fullTrim);

      // 정규표현식 - 숫자만 인지? 이메일 형식인지? 핸드폰 번호인지?
      //             이름(알파벳)인지?

      //--------------------------------------------------------------------

      // [문자열 함수 한 눈에 보기 요약본]

      // 1. 선언 (Declaration)
      let str = "Hello Java Script"; // [추천] 리터럴 방식 (가벼움)
      let strObj = new String("Obj"); // [비추] 객체 방식 (무거움, 수정가능이라지만 잘 안씀)

      // =======================================================

      // 2. 확인 및 탐색 (Check & Search)
      console.log(str.length); // 길이 확인 (공백 포함) -> 17
      console.log(str.charAt(0)); // 0번째 글자 가져오기 -> "H"
      console.log(str[0]); // [추천] 0번째 글자 (배열처럼 접근) -> "H"

      console.log(str.indexOf("Java")); // "Java"가 시작되는 인덱스 -> 6
      console.log(str.indexOf("Python")); // 못 찾으면 -> -1 (중요!)
      console.log(str.lastIndexOf("a")); // 뒤에서부터 찾은 "a"의 인덱스 -> 9

      // =======================================================

      // 3. 변환 (Change) - ★ 원본은 안 바뀜! (복사본 반환)
      console.log(str.toUpperCase()); // 대문자로 -> "HELLO JAVA SCRIPT"
      console.log(str.toLowerCase()); // 소문자로 -> "hello java script"

      // 치환: replace("찾을거", "바꿀거")
      let newStr = str.replace("Java", "ECMA");
      console.log(newStr); // "Hello ECMA Script"

      // =======================================================

      // 4. 자르기 & 나누기 (Cut & Split)
      // substring(시작, 끝-1) : 인덱스 6부터 10번 앞까지(9번까지)
      console.log(str.substring(6, 10)); // "Java"

      // split("기준") : 문자를 쪼개서 [배열]로 만듦 (CSV 데이터 처리에 필수)
      let fruits = "사과,배,포도";
      let arr = fruits.split(",");
      console.log(arr); // ["사과", "배", "포도"]

      // =======================================================

      // 5. 합치기 (Join)
      let str1 = "Hello";
      let str2 = "World";
      console.log(str1.concat(str2)); // 함수 사용 -> "HelloWorld"
      console.log(str1 + str2); // [추천] + 연산자 사용 (직관적) -> "HelloWorld"

      // =======================================================

      // 6. 공백 제거 (Cleaning)
      let messy = "  Hello World  ";
      console.log(messy.trim()); // 앞뒤 공백만 제거 -> "Hello World"

      // [심화] 모든 공백 제거 (정규표현식 활용)
      // / \s /g -> s(Space, 공백)를 g(Global, 전체)에서 찾아라
      console.log(messy.replace(/\s/g, "")); // "HelloWorld"
    </script>
  </head>
  <body></body>
</html>
