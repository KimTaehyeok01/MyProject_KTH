<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자바스크립트 중급문법</title>
    <script>
      // 고차함수(Higher-Order Function), 배열메소드
      // : 함수를 매개변수로 받거나 함수를 반환하는 함수
      // forEach, map, reduce, find, filter함수

      // forEach함수 ========================================
      let arr = [10, 20, 30, 40, 50];
      // 전체 순회
      for (const item of arr) {
        console.log(item);
      }
      console.log("------------------");

      // 고차함수는 함수를 입력받을 수 있다.
      // 함수 실행을 대행하도록 하는 것.
      arr.forEach(() => {});
      // 매개변수로 들어올 수 있는 3가지
      // 1. item : 배열의 아이템
      // 2. index : 순번
      // 3. array : 배열 원본
      arr.forEach((item, index, array) => {
        console.log(item, index, array);
      });

      console.log("------------------");

      arr.forEach((item, index) => {
        console.log(item, index);
      });
      console.log("------------------");
      // map함수 ========================================
      // map함수 : 원본 배열이 변경 되지않음, sort()함수는 원본이 변경됨.
      // map함수도 foreach함수처럼
      // 매개변수로 들어올 수 있는 3가지
      // 1. item : 배열의 아이템
      // 2. index : 순번
      // 3. array : 배열 원본
      // 용도 : 기존 배열에 어떤 처리를 가해서 새로운 배열을 만들기 위해.
      const newArr = arr.map((item) => {
        return item * 2;
      });

      console.log(arr); // [10, 20, 30, 40, 50]
      console.log(newArr); // [10, 20, 30, 40, 50] *2 = [20, 40, 60, 80, 100]

      // 예) 문자열을 모두 숫자로 바꾸고 싶을때
      let str = "10 20 30 40 50";
      console.log(typeof str);

      // 숫자 배열로 바꾸자
      let nums = str.split(" ").map(Number);
      let nums2 = str.split(" ").map((item) => {
        return Number(item);
      });
      console.log(nums);
      console.log(typeof nums[0]);

      // kv객체 배열에서의 경우
      const users = [
        { id: 1, name: "hong" },
        { id: 2, name: "park" },
        { id: 3, name: "lee" },
      ];

      users.forEach((user) => {
        console.log(user.name);
      });
    </script>
  </head>
  <body></body>
</html>
