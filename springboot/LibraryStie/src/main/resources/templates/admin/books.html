<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>도서 관리 - 관리자</title>
    <style>
      :root {
        --bg: #f0f4f8;
        --surface: #fff;
        --surface-alt: #f8f9fa;
        --border: #e2e8f0;
        --text-primary: #1a202c;
        --text-secondary: #4a5568;
        --text-muted: #9399a6;
        --primary: #1e3a5f;
        --primary-light: #2d5a8e;
        --primary-soft: #e8f0f8;
        --accent: #e8a020;
        --accent-soft: #fef3e0;
        --danger: #e84545;
        --danger-soft: #fdf0f0;
        --success: #22c55e;
        --success-soft: #f0fdf4;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.07);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
        --radius: 12px;
        --radius-sm: 8px;
        --transition: 0.18s ease;
      }
      body.dark {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface-alt: #22263a;
        --border: #2e3347;
        --text-primary: #e8eaf0;
        --text-secondary: #9399a6;
        --text-muted: #5c6370;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100vh;
      }
      .nav-bar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0 28px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: var(--shadow-sm);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .nav-logo {
        font-size: 20px;
        font-weight: 800;
        color: var(--primary);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .nav-logo span {
        color: var(--text-primary);
      }
      .nav-badge {
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 8px;
        margin-left: 6px;
      }
      .nav-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn-nav {
        padding: 7px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-secondary);
        transition: all var(--transition);
      }
      .btn-nav:hover {
        background: var(--surface-alt);
      }
      .btn-nav-active {
        background: var(--primary-soft);
        color: var(--primary);
        border-color: var(--primary);
      }
      .theme-toggle {
        width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-alt);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }
      .wrap {
        max-width: 1300px;
        margin: 0 auto;
        padding: 36px 16px 60px;
      }
      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 12px;
      }
      .page-title {
        font-size: 24px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .btn-add {
        padding: 9px 20px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
        transition: all var(--transition);
      }
      .btn-add:hover {
        background: var(--primary-light);
      }
      .total-badge {
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 13px;
        font-weight: 700;
        padding: 4px 14px;
        border-radius: 12px;
      }
      /* 필터 바 */
      .filter-bar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 20px;
        margin-bottom: 20px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .search-input {
        flex: 1;
        min-width: 180px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 9px 14px;
        font-size: 14px;
        background: var(--surface-alt);
        color: var(--text-primary);
        outline: none;
      }
      .search-input:focus {
        border-color: var(--primary);
      }
      /* 테이블 */
      .section-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        padding: 12px 14px;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-muted);
        background: var(--surface-alt);
        text-align: center;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 12px 14px;
        font-size: 13px;
        color: var(--text-primary);
        border-bottom: 1px solid var(--border);
        text-align: center;
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: var(--surface-alt);
      }
      .avail-ok {
        color: var(--success);
        font-weight: 700;
      }
      .avail-low {
        color: var(--accent);
        font-weight: 700;
      }
      .avail-none {
        color: var(--danger);
        font-weight: 700;
      }
      .td-left {
        text-align: left;
      }
      .action-btns {
        display: flex;
        gap: 6px;
        justify-content: center;
      }
      .btn-edit {
        padding: 5px 12px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        background: var(--accent-soft);
        color: var(--accent);
        transition: all var(--transition);
      }
      .btn-edit:hover {
        background: var(--accent);
        color: #fff;
      }
      .btn-delete {
        padding: 5px 12px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        background: var(--danger-soft);
        color: var(--danger);
        transition: all var(--transition);
      }
      .btn-delete:hover {
        background: var(--danger);
        color: #fff;
      }
      .empty-msg {
        padding: 60px;
        text-align: center;
        color: var(--text-muted);
        font-size: 15px;
      }
      /* 모달 */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 200;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal-overlay.open {
        display: flex;
      }
      .modal {
        background: var(--surface);
        border-radius: var(--radius);
        padding: 32px;
        width: 100%;
        max-width: 560px;
        box-shadow: var(--shadow-md);
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-title {
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .form-group.full {
        grid-column: 1/-1;
      }
      .form-label {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-secondary);
      }
      .form-input,
      .form-textarea,
      .form-select {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 9px 12px;
        font-size: 14px;
        background: var(--surface-alt);
        color: var(--text-primary);
        outline: none;
        font-family: inherit;
      }
      .form-input:focus,
      .form-textarea:focus,
      .form-select:focus {
        border-color: var(--primary);
      }
      .form-textarea {
        resize: vertical;
        min-height: 80px;
      }
      .modal-footer {
        margin-top: 24px;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .btn-submit {
        padding: 10px 24px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
        transition: all var(--transition);
      }
      .btn-submit:hover {
        background: var(--primary-light);
      }
      .btn-cancel {
        padding: 10px 20px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 600;
        border: 1px solid var(--border);
        cursor: pointer;
        background: var(--surface-alt);
        color: var(--text-secondary);
        transition: all var(--transition);
      }
      .btn-cancel:hover {
        background: var(--border);
      }
    </style>
  </head>
  <body>
    <nav class="nav-bar">
      <a class="nav-logo" th:href="@{/}"
        >📚 <span>행복도서관</span><span class="nav-badge">ADMIN</span></a
      >
      <div class="nav-actions">
        <a class="btn-nav" th:href="@{/admin}">대시보드</a>
        <a class="btn-nav" th:href="@{/admin/members}">회원 관리</a>
        <a class="btn-nav" th:href="@{/admin/loans}">대출 현황</a>
        <a class="btn-nav btn-nav-active" th:href="@{/admin/books}"
          >도서 관리</a
        >
        <a class="btn-nav" th:href="@{/}">← 메인</a>
        <form
          th:action="@{/logoutAction}"
          method="post"
          style="display: inline"
        >
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />
          <button type="submit" class="btn-nav">로그아웃</button>
        </form>
        <button class="theme-toggle" id="themeToggle">🌙</button>
      </div>
    </nav>

    <div class="wrap">
      <div class="page-header">
        <div class="page-title">📚 도서 관리</div>
        <div style="display: flex; align-items: center; gap: 12px">
          <span class="total-badge"
            >총 <span th:text="${totalCount}">0</span>권</span
          >
          <button class="btn-add" onclick="openAddModal()">+ 도서 등록</button>
        </div>
      </div>

      <div class="filter-bar">
        <input
          class="search-input"
          id="searchInput"
          type="text"
          placeholder="도서명, 저자, 카테고리로 검색..."
        />
      </div>

      <div class="section-card">
        <table id="bookTable" th:if="${!bookList.isEmpty()}">
          <thead>
            <tr>
              <th>#</th>
              <th>도서명</th>
              <th>저자</th>
              <th>출판사</th>
              <th>카테고리</th>
              <th>전체</th>
              <th>대출가능</th>
              <th>출판일</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="book, stat : ${bookList}">
              <td th:text="${stat.count}">1</td>
              <td class="td-left" th:text="${book.title}">도서명</td>
              <td th:text="${book.author}">저자</td>
              <td th:text="${book.publisher}">출판사</td>
              <td th:text="${book.category}">카테고리</td>
              <td th:text="${book.totalQuantity}">0</td>
              <td>
                <span
                  th:classappend="${book.availableQuantity == 0} ? 'avail-none' : (${book.availableQuantity <= 2} ? 'avail-low' : 'avail-ok')"
                  th:text="${book.availableQuantity}"
                  >0</span
                >
              </td>
              <td
                th:text="${book.publishDate != null ? book.publishDate : '-'}"
              >
                출판일
              </td>
              <td>
                <div class="action-btns">
                  <button
                    class="btn-edit"
                    th:attr="onclick='openEditModal(' + ${book.id} + ',\'' + ${book.title} + '\',\'' + ${book.author} + '\',\'' + ${book.publisher} + '\',\'' + (${book.isbn} != null ? book.isbn : '') + '\',\'' + ${book.category} + '\',' + ${book.totalQuantity} + ',\'' + (${book.publishDate} != null ? book.publishDate : '') + '\')'"
                  >
                    수정
                  </button>
                  <form
                    th:action="@{/admin/books/delete}"
                    method="post"
                    style="display: inline"
                  >
                    <input
                      type="hidden"
                      th:name="${_csrf.parameterName}"
                      th:value="${_csrf.token}"
                    />
                    <input type="hidden" name="id" th:value="${book.id}" />
                    <button
                      type="submit"
                      class="btn-delete"
                      onclick="
                        return confirm(
                          '도서를 삭제하시겠습니까?\n대출 중인 도서가 있으면 삭제되지 않을 수 있습니다.',
                        );
                      "
                    >
                      삭제
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <div class="empty-msg" th:if="${bookList.isEmpty()}">
          📚 등록된 도서가 없습니다.
        </div>
      </div>
    </div>

    <!-- 도서 등록 모달 -->
    <div class="modal-overlay" id="addModal">
      <div class="modal">
        <div class="modal-title">📖 도서 등록</div>
        <form
          th:action="@{/admin/books/save}"
          method="post"
          target="_blank"
          onsubmit="handleFormSubmit(event, this)"
        >
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />
          <div class="form-grid">
            <div class="form-group full">
              <label class="form-label">도서명 *</label>
              <input
                class="form-input"
                type="text"
                name="title"
                required
                placeholder="도서명을 입력하세요"
              />
            </div>
            <div class="form-group">
              <label class="form-label">저자 *</label>
              <input
                class="form-input"
                type="text"
                name="author"
                required
                placeholder="저자명"
              />
            </div>
            <div class="form-group">
              <label class="form-label">출판사 *</label>
              <input
                class="form-input"
                type="text"
                name="publisher"
                required
                placeholder="출판사명"
              />
            </div>
            <div class="form-group">
              <label class="form-label">ISBN</label>
              <input
                class="form-input"
                type="text"
                name="isbn"
                placeholder="ISBN (선택)"
              />
            </div>
            <div class="form-group">
              <label class="form-label">카테고리 *</label>
              <select class="form-select" name="category" required>
                <option value="">선택하세요</option>
                <option value="소설">소설</option>
                <option value="자기계발">자기계발</option>
                <option value="경제/경영">경제/경영</option>
                <option value="역사">역사</option>
                <option value="과학">과학</option>
                <option value="컴퓨터/IT">컴퓨터/IT</option>
                <option value="철학">철학</option>
                <option value="시/에세이">시/에세이</option>
                <option value="기타">기타</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">수량 *</label>
              <input
                class="form-input"
                type="number"
                name="totalQuantity"
                min="1"
                value="1"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">출판일</label>
              <input class="form-input" type="date" name="publishDate" />
            </div>
            <div class="form-group full">
              <label class="form-label">도서 소개</label>
              <textarea
                class="form-textarea"
                name="description"
                placeholder="도서 소개 (선택)"
              ></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-cancel" onclick="closeAddModal()">
              취소
            </button>
            <button type="submit" class="btn-submit">등록</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 도서 수정 모달 -->
    <div class="modal-overlay" id="editModal">
      <div class="modal">
        <div class="modal-title">✏ 도서 수정</div>
        <form
          th:action="@{/admin/books/update}"
          method="post"
          target="_blank"
          onsubmit="handleFormSubmit(event, this)"
        >
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />
          <input type="hidden" name="id" id="editId" />
          <div class="form-grid">
            <div class="form-group full">
              <label class="form-label">도서명 *</label>
              <input
                class="form-input"
                type="text"
                name="title"
                id="editTitle"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">저자 *</label>
              <input
                class="form-input"
                type="text"
                name="author"
                id="editAuthor"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">출판사 *</label>
              <input
                class="form-input"
                type="text"
                name="publisher"
                id="editPublisher"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">ISBN</label>
              <input class="form-input" type="text" name="isbn" id="editIsbn" />
            </div>
            <div class="form-group">
              <label class="form-label">카테고리 *</label>
              <select
                class="form-select"
                name="category"
                id="editCategory"
                required
              >
                <option value="소설">소설</option>
                <option value="자기계발">자기계발</option>
                <option value="경제/경영">경제/경영</option>
                <option value="역사">역사</option>
                <option value="과학">과학</option>
                <option value="컴퓨터/IT">컴퓨터/IT</option>
                <option value="철학">철학</option>
                <option value="시/에세이">시/에세이</option>
                <option value="기타">기타</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">수량 *</label>
              <input
                class="form-input"
                type="number"
                name="totalQuantity"
                id="editQuantity"
                min="1"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">출판일</label>
              <input
                class="form-input"
                type="date"
                name="publishDate"
                id="editPublishDate"
              />
            </div>
            <div class="form-group full">
              <label class="form-label">도서 소개</label>
              <textarea
                class="form-textarea"
                name="description"
                id="editDescription"
              ></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-cancel" onclick="closeEditModal()">
              취소
            </button>
            <button type="submit" class="btn-submit">수정</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      // 도서 등록 모달
      function openAddModal() {
        document.getElementById("addModal").classList.add("open");
      }
      function closeAddModal() {
        document.getElementById("addModal").classList.remove("open");
      }

      // 도서 수정 모달
      function openEditModal(
        id,
        title,
        author,
        publisher,
        isbn,
        category,
        quantity,
        publishDate,
      ) {
        document.getElementById("editId").value = id;
        document.getElementById("editTitle").value = title;
        document.getElementById("editAuthor").value = author;
        document.getElementById("editPublisher").value = publisher;
        document.getElementById("editIsbn").value = isbn;
        document.getElementById("editCategory").value = category;
        document.getElementById("editQuantity").value = quantity;
        document.getElementById("editPublishDate").value = publishDate;
        document.getElementById("editModal").classList.add("open");
      }
      function closeEditModal() {
        document.getElementById("editModal").classList.remove("open");
      }

      // 모달 외부 클릭 시 닫기
      document
        .getElementById("addModal")
        .addEventListener("click", function (e) {
          if (e.target === this) closeAddModal();
        });
      document
        .getElementById("editModal")
        .addEventListener("click", function (e) {
          if (e.target === this) closeEditModal();
        });

      // 폼 제출 (컨트롤러가 @ResponseBody로 script 반환하므로 iframe으로 처리 후 리로드)
      function handleFormSubmit(e, form) {
        e.preventDefault();
        const formData = new FormData(form);
        fetch(form.action, { method: "POST", body: formData })
          .then((res) => res.text())
          .then((html) => {
            // script 태그에서 alert 메시지 추출
            const match = html.match(/alert\('([^']+)'\)/);
            if (match) alert(match[1]);
            location.reload();
          })
          .catch(() => {
            alert("오류가 발생했습니다.");
            location.reload();
          });
      }

      // 검색 필터
      document
        .getElementById("searchInput")
        .addEventListener("input", function () {
          const keyword = this.value.toLowerCase();
          const rows = document.querySelectorAll("#bookTable tbody tr");
          rows.forEach((row) => {
            row.style.display = row.textContent.toLowerCase().includes(keyword)
              ? ""
              : "none";
          });
        });

      const toggleBtn = document.getElementById("themeToggle");
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        toggleBtn.textContent = "☀️";
      }
      toggleBtn.addEventListener("click", () => {
        const isDark = document.body.classList.toggle("dark");
        toggleBtn.textContent = isDark ? "☀️" : "🌙";
        localStorage.setItem("theme", isDark ? "dark" : "light");
      });
    </script>
  </body>
</html>
