<!doctype html>
<html lang="ko">
  <body>
    <div id="container"></div>

    <script>
      // 1. 배열 데이터 (재료)
      const sizeList = [
        { id: "btn-s", value: "S", name: "스몰" },
        { id: "btn-m", value: "M", name: "미디움" },
        { id: "btn-l", value: "L", name: "라지" },
      ];

      // 2. map으로 버튼 만들기 (기계 가동)
      const SizeList = sizeList.map((item) => {
        return `<Button id="${item.id}" value="${item.value}">${item.name}</Button>`;
      });
      document.getElementById("container").innerHTML = SizeList.join(" ");
    </script>
  </body>
</html>
