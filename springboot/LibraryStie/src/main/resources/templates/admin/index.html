<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 대시보드 - 행복도서관</title>
    <style>
      :root {
        --bg: #f0f4f8;
        --surface: #fff;
        --surface-alt: #f8f9fa;
        --border: #e2e8f0;
        --text-primary: #1a202c;
        --text-secondary: #4a5568;
        --text-muted: #9399a6;
        --primary: #1e3a5f;
        --primary-light: #2d5a8e;
        --primary-soft: #e8f0f8;
        --accent: #e8a020;
        --accent-soft: #fef3e0;
        --danger: #e84545;
        --danger-soft: #fdf0f0;
        --success: #22c55e;
        --success-soft: #f0fdf4;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.07);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
        --radius: 12px;
        --radius-sm: 8px;
        --transition: 0.18s ease;
      }
      body.dark {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface-alt: #22263a;
        --border: #2e3347;
        --text-primary: #e8eaf0;
        --text-secondary: #9399a6;
        --text-muted: #5c6370;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100vh;
      }
      .nav-bar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0 28px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: var(--shadow-sm);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .nav-logo {
        font-size: 20px;
        font-weight: 800;
        color: var(--primary);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .nav-logo span {
        color: var(--text-primary);
      }
      .nav-badge {
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 8px;
        margin-left: 6px;
      }
      .nav-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn-nav {
        padding: 7px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-secondary);
        transition: all var(--transition);
      }
      .btn-nav:hover {
        background: var(--surface-alt);
      }
      .btn-nav-active {
        background: var(--primary-soft);
        color: var(--primary);
        border-color: var(--primary);
      }
      .theme-toggle {
        width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-alt);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 36px 16px 60px;
      }
      .page-title {
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .page-sub {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 32px;
      }
      /* 통계 카드 */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 32px;
      }
      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        gap: 18px;
        transition: transform var(--transition);
      }
      .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }
      .stat-icon {
        width: 56px;
        height: 56px;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        flex-shrink: 0;
      }
      .icon-blue {
        background: var(--primary-soft);
      }
      .icon-amber {
        background: var(--accent-soft);
      }
      .icon-green {
        background: var(--success-soft);
      }
      .icon-red {
        background: var(--danger-soft);
      }
      .stat-info h4 {
        font-size: 28px;
        font-weight: 800;
        color: var(--primary);
      }
      .stat-info p {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 3px;
      }
      /* 메뉴 카드 */
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
      }
      .menu-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px;
        box-shadow: var(--shadow-sm);
        text-decoration: none;
        color: var(--text-primary);
        transition: all var(--transition);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .menu-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-md);
        border-color: var(--primary);
      }
      .menu-card-icon {
        font-size: 36px;
      }
      .menu-card h3 {
        font-size: 18px;
        font-weight: 700;
      }
      .menu-card p {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.6;
      }
      .menu-card-arrow {
        margin-top: auto;
        font-size: 12px;
        font-weight: 700;
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <nav class="nav-bar">
      <a class="nav-logo" th:href="@{/}"
        >📚 <span>행복도서관</span><span class="nav-badge">ADMIN</span></a
      >
      <div class="nav-actions">
        <a class="btn-nav btn-nav-active" th:href="@{/admin}">대시보드</a>
        <a class="btn-nav" th:href="@{/admin/members}">회원 관리</a>
        <a class="btn-nav" th:href="@{/admin/loans}">대출 현황</a>
        <a class="btn-nav" th:href="@{/admin/books}">도서 관리</a>
        <a class="btn-nav" th:href="@{/}">← 메인</a>
        <form
          th:action="@{/logoutAction}"
          method="post"
          style="display: inline"
        >
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />
          <button type="submit" class="btn-nav">로그아웃</button>
        </form>
        <button class="theme-toggle" id="themeToggle">🌙</button>
      </div>
    </nav>

    <div class="wrap">
      <div class="page-title">⚙ 관리자 대시보드</div>
      <div class="page-sub">도서관 전체 현황을 확인하고 관리하세요.</div>

      <!-- 통계 카드 -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon icon-blue">👥</div>
          <div class="stat-info">
            <h4 th:text="${totalMembers}">0</h4>
            <p>전체 회원 수</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon icon-amber">📚</div>
          <div class="stat-info">
            <h4 th:text="${totalBooks}">0</h4>
            <p>전체 도서 수</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon icon-green">📖</div>
          <div class="stat-info">
            <h4 th:text="${activeLoans}">0</h4>
            <p>현재 대출 중</p>
          </div>
        </div>
      </div>

      <!-- 관리 메뉴 -->
      <div class="menu-grid">
        <a class="menu-card" th:href="@{/admin/members}">
          <div class="menu-card-icon">👥</div>
          <h3>회원 관리</h3>
          <p>
            가입된 회원 목록을 조회하고, 문제 회원을 강제 탈퇴 처리할 수
            있습니다.
          </p>
          <div class="menu-card-arrow">회원 목록 보기 →</div>
        </a>
        <a class="menu-card" th:href="@{/admin/loans}">
          <div class="menu-card-icon">📋</div>
          <h3>대출 현황</h3>
          <p>전체 대출 이력 및 현재 대출 중인 도서 현황을 확인합니다.</p>
          <div class="menu-card-arrow">대출 현황 보기 →</div>
        </a>
        <a class="menu-card" th:href="@{/admin/books}">
          <div class="menu-card-icon">📚</div>
          <h3>도서 관리</h3>
          <p>도서를 등록, 수정, 삭제하고 재고 현황을 관리합니다.</p>
          <div class="menu-card-arrow">도서 관리 →</div>
        </a>
      </div>
    </div>

    <script>
      const toggleBtn = document.getElementById("themeToggle");
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        toggleBtn.textContent = "☀️";
      }
      toggleBtn.addEventListener("click", () => {
        const isDark = document.body.classList.toggle("dark");
        toggleBtn.textContent = isDark ? "☀️" : "🌙";
        localStorage.setItem("theme", isDark ? "dark" : "light");
      });
    </script>
  </body>
</html>
