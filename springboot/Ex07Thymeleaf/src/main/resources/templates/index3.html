<!Doctype html>
<!-- xmlns : xml name space XML의 태그와 속성을 정의하는 곳 -->
<!-- th : 타임리프 관련 태그나 속성은 th로 시작함. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>index.html</title>
</head>
<body>
<h2>타임리프의 형식화된 출력</h2>
    <p th:text="${#dates.format(standardDate, 'yyyy/MM/dd HH:mm:ss')}"></p>
    <p th:text="${#temporals.format(localDate,'yyyy/MM/dd')}"></p>
    <p th:text="${#temporals.format(localDateTime,'yyyy/MM/dd HH:mm:ss')}"></p>

    <p th:text="${#numbers.formatInteger(number1,3,'COMMA')}"></p>
    <p th:text="|${#numbers.formatInteger(number1,3,'COMMA')}원|"></p>
    <p th:text="${#numbers.formatDecimal(number1,3,'COMMA',2,'POINT')}"></p>
</body>
</html>
