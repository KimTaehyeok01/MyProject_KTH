<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>스마트 재고 관리 시스템</title>
    <script>
      /**
       * [원본 데이터]
       * 우리 회사의 비품 재고 현황입니다.
       */
      const inventory = [
        { item: "노트북", stock: 5, price: 1200000 },
        { item: "마우스", stock: 15, price: 30000 },
        { item: "키보드", stock: 2, price: 80000 },
        { item: "모니터", stock: 8, price: 350000 },
        { item: "멀티탭", stock: 1, price: 15000 },
      ];
      /**
       * [업무 규칙 (Business Logic)]
       * 1. 대상 선별: 현재 재고(stock)가 10개 미만인 품목만 발주 대상입니다.
       * 2. 상태 판별:
       * - 재고가 3개 이하이면 "매우 부족"
       * - 재고가 4개 이상 9개 이하이면 "주의"
       * 3. 발주 비용 계산: (10 - 현재 재고) * 가격
       *
       * [기술 제약 조건]
       * - 반드시 forEach를 사용하여 배열을 순회할 것.
       * - 상태(status)를 판별하는 로직은 별도의 콜백 함수로 분리할 것.
       * - 원본 데이터 inventory를 수정하지 말 것.
       * * [최종 결과물]
       * - reorderList 배열에 { productName, status, cost } 형태로 담아 출력.
       */
      let reorderList = [];

      // 1. 상태 판별 콜백 함수 정의
      const checkStatus = (stock) => {
        if (stock.stock < 10) {
          return true;
        } else return false;
      };

      const main = (list, func) => {
        let status = "";
        let cost = 0;
        list.forEach((value) => {
          if (func(value) == true) {
            if (value.stock <= 3) {
              value.status = "매우 부족";
              value.cost = (10 - value.stock) * value.price;
            } else if (value.stock >= 4 && value.stock <= 9) {
              value.status = "주의";
              value.cost = (10 - value.stock) * value.price;
            }
            reorderList.push({
              productName: value.item,
              status: value.status,
              cost: value.cost,
            });
          }
        });
      };

      console.log("--- 최종 발주 목록 ---");
      main(inventory, checkStatus);
      console.log(reorderList);
    </script>
  </head>
  <body>
    <h1>재고 관리 시스템 정산 결과</h1>
  </body>
</html>
