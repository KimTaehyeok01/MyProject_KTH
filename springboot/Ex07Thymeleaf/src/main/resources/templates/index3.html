<!Doctype html>
<!-- xmlns : xml name space XML의 태그와 속성을 정의하는 곳 -->
<!-- th : 타임리프 관련 태그나 속성은 th로 시작함. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>index.html</title>
</head>
<body>
    <h2>테스트</h2>
    <p th:text="${name_test}">이름</p>
    <p th:utext="${name_test}">이름</p>
    <p th:text="${age_test}">나이</p>

    <th:block th:if="${address_null == null}">
        <p>address_null</p>
    </th:block>
</body>
</html>
