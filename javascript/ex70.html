<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ex70 -->
    <title>CSS 선택자로 문서요소 선택하기</title>
    <script>
      //연습문제
      //1. id가 wrap인 div밑의 h1의 텍스트색상을 green로 바꾸시오.
      //2. 내용인 "제목태그3"인 객체의 color를 blue으로 변경하시오.
      //3. 내용인 "제목태그4"인 객체의 color를 orange으로 변경하시오.
      //4. id가 'wrap'인 div의 border를 1px solid red로 바꾸시오.
      window.onload = () => {
        // let divH1 = document.getElementsByTagName("h1");
        // divH1[5].style.color = "green";

        let h1Class = document.getElementsByClassName("headers");
        h1Class[0].style.color = "blue";
        h1Class[1].style.color = "orange";

        // let divWrap = document.getElementById("wrap");
        // divWrap.style.border = "1px solid red";

        let divarr = document.getElementById("wrap");
        divarr.style.border = "1px solid red";
        divarr.style.color = "green";
      };
    </script>
  </head>
  <body>
    <h1 id="header-1">제목태그1</h1>
    <h1 id="header-2">제목태그2</h1>
    <h1 class="headers">제목태그3</h1>
    <h1 class="headers">제목태그4</h1>
    <h1 class="headers">제목태그5</h1>
    <div id="wrap">
      <div>
        <h1>Wrapper</h1>
      </div>
    </div>
  </body>
</html>
