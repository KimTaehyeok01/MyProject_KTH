<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta id="jwt-token" th:content="${jwtToken}"/>
  <title>도서관 - 메인</title>
  <style>
    :root {
        --bg: #f0f4f8;
        --surface: #ffffff;
        --surface-alt: #f8f9fa;
        --border: #e2e8f0;
        --text-primary: #1a202c;
        --text-secondary: #4a5568;
        --text-muted: #9399a6;
        --primary: #1e3a5f;
        --primary-light: #2d5a8e;
        --primary-soft: #e8f0f8;
        --accent: #e8a020;
        --accent-soft: #fef3e0;
        --danger: #e84545;
        --danger-soft: #fdf0f0;
        --success: #22c55e;
        --success-soft: #f0fdf4;
        --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
        --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
        --radius: 12px;
        --radius-sm: 8px;
        --transition: 0.18s ease;
    }
    body.dark {
        --bg: #0f1117; --surface: #1a1d27; --surface-alt: #22263a;
        --border: #2e3347; --text-primary: #e8eaf0; --text-secondary: #9399a6;
        --text-muted: #5c6370; --primary-soft: #1e2548; --accent-soft: #2a1f0a;
        --shadow-sm: 0 1px 3px rgba(0,0,0,0.3); --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', 'Noto Sans KR', Arial, sans-serif;
        background: var(--bg); color: var(--text-primary);
        min-height: 100vh; transition: background var(--transition), color var(--transition);
    }
    /* ── 네비 바 ── */
    .nav-bar {
        background: var(--surface); border-bottom: 1px solid var(--border);
        padding: 0 28px; height: 60px;
        display: flex; align-items: center; justify-content: space-between;
        box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 100;
    }
    .nav-logo {
        font-size: 20px; font-weight: 800; color: var(--primary);
        text-decoration: none; display: flex; align-items: center; gap: 8px;
    }
    .nav-logo span { color: var(--text-primary); }
    .nav-center { display: flex; gap: 4px; }
    .nav-link {
        padding: 6px 14px; border-radius: var(--radius-sm); font-size: 14px;
        font-weight: 500; text-decoration: none; color: var(--text-secondary);
        transition: all var(--transition);
    }
    .nav-link:hover, .nav-link.active { background: var(--primary-soft); color: var(--primary); }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .nav-user-chip {
        display: flex; align-items: center; gap: 6px;
        background: var(--surface-alt); border: 1px solid var(--border);
        border-radius: 20px; padding: 5px 14px; font-size: 13px; font-weight: 600;
    }
    .btn-nav {
        padding: 7px 16px; border-radius: var(--radius-sm); font-size: 13px;
        font-weight: 600; cursor: pointer; text-decoration: none;
        border: 1px solid var(--border); background: var(--surface);
        color: var(--text-secondary); transition: all var(--transition);
    }
    .btn-nav:hover { background: var(--surface-alt); }
    .btn-nav-primary {
        background: var(--primary); color: #fff; border-color: var(--primary);
    }
    .btn-nav-primary:hover { background: var(--primary-light); }
    .btn-nav-admin {
        background: var(--accent-soft); color: var(--accent);
        border-color: var(--accent); font-size: 12px;
    }
    .theme-toggle {
        width: 36px; height: 36px; border: 1px solid var(--border);
        border-radius: var(--radius-sm); background: var(--surface-alt);
        cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px;
    }
    /* ── 히어로 ── */
    .hero {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        padding: 52px 28px; text-align: center; color: #fff;
    }
    .hero h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
    .hero p { font-size: 15px; opacity: 0.85; margin-bottom: 28px; }
    .hero-search {
        display: flex; max-width: 560px; margin: 0 auto; background: #fff;
        border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .hero-search input {
        flex: 1; padding: 14px 20px; border: none; outline: none;
        font-size: 15px; color: #2d3748;
    }
    .hero-search button {
        padding: 14px 24px; background: var(--accent); color: #fff;
        border: none; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    /* ── 컨텐츠 ── */
    .wrap { max-width: 1100px; margin: 0 auto; padding: 36px 16px 60px; }
    .section-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 20px;
    }
    .section-title { font-size: 20px; font-weight: 700; }
    .book-count {
        font-size: 13px; color: var(--text-secondary); background: var(--surface-alt);
        border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px;
    }
    .book-count strong { color: var(--primary); }
    /* ── 카테고리 필터 ── */
    .category-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .cat-btn {
        padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
        border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
        text-decoration: none; cursor: pointer; transition: all var(--transition);
    }
    .cat-btn:hover, .cat-btn.active {
        background: var(--primary); color: #fff; border-color: var(--primary);
    }
    /* ── 도서 그리드 ── */
    .book-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px; margin-bottom: 36px;
    }
    .book-card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm);
        transition: all var(--transition); display: flex; flex-direction: column; gap: 10px;
    }
    .book-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .book-cover {
        width: 100%; height: 130px; background: var(--primary-soft);
        border-radius: var(--radius-sm); display: flex; align-items: center;
        justify-content: center; font-size: 48px;
    }
    .book-category-badge {
        display: inline-block; padding: 2px 10px; border-radius: 12px;
        font-size: 11px; font-weight: 600; background: var(--primary-soft); color: var(--primary);
    }
    .book-title { font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--text-primary); }
    .book-author { font-size: 12px; color: var(--text-secondary); }
    .book-status-row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .status-badge {
        font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 12px;
    }
    .status-available { background: var(--success-soft); color: var(--success); }
    .status-unavailable { background: var(--danger-soft); color: var(--danger); }
    .btn-loan {
        padding: 7px 14px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700;
        border: none; cursor: pointer; transition: all var(--transition);
        background: var(--primary); color: #fff;
    }
    .btn-loan:hover { background: var(--primary-light); }
    .btn-loan:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
    /* ── 페이지네이션 ── */
    .pagination-wrap { display: flex; justify-content: center; margin-top: 28px; }
    .pagination { display: flex; list-style: none; gap: 4px; }
    .page-link {
        display: flex; align-items: center; justify-content: center;
        min-width: 38px; height: 38px; padding: 0 10px;
        text-decoration: none; color: var(--text-secondary);
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius-sm); font-size: 13px; transition: all var(--transition);
    }
    .page-item.active .page-link { background: var(--primary); color: #fff; border-color: var(--primary); }
    .page-item.disabled .page-link { opacity: 0.4; pointer-events: none; }
    /* ── 알림 토스트 ── */
    .toast {
        position: fixed; bottom: 28px; right: 28px; z-index: 999;
        background: var(--primary); color: #fff; padding: 14px 22px;
        border-radius: 10px; font-size: 14px; font-weight: 600;
        box-shadow: 0 6px 24px rgba(0,0,0,0.25);
        transform: translateY(80px); opacity: 0;
        transition: all 0.3s ease; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

<!-- ── 네비 바 ── -->
<nav class="nav-bar">
  <a class="nav-logo" th:href="@{/}">📚 <span>도서관</span></a>
  <div class="nav-center">
    <a class="nav-link active" th:href="@{/}">메인</a>
    <a class="nav-link" th:href="@{/loan}" sec:authorize="isAuthenticated()">대출/반납</a>
  </div>
  <div class="nav-actions">
    <!-- 로그인 상태 -->
    <th:block sec:authorize="isAuthenticated()">
      <div class="nav-user-chip">
        👤 <span th:text="${session.userName != null ? session.userName : #authentication.name}">사용자</span>
      </div>
      <!-- 관리자 전용 버튼 -->
      <a class="btn-nav btn-nav-admin" th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">⚙ 관리자</a>
      <a class="btn-nav" th:href="@{/mypage}">마이페이지</a>
      <form th:action="@{/logoutAction}" method="post" style="display:inline;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn-nav">로그아웃</button>
      </form>
    </th:block>
    <!-- 비로그인 상태 -->
    <th:block sec:authorize="isAnonymous()">
      <a class="btn-nav btn-nav-primary" th:href="@{/login}">로그인</a>
    </th:block>
    <button class="theme-toggle" id="themeToggle">🌙</button>
  </div>
</nav>

<!-- ── 히어로 섹션 ── -->
<div class="hero">
  <h1>📚 도서관에 오신 것을 환영합니다</h1>
  <p>원하는 책을 검색하고 손쉽게 대출하세요</p>
  <form class="hero-search" th:action="@{/}" method="get">
    <input type="text" name="keyword" th:value="${keyword}" placeholder="도서명 또는 저자를 검색하세요..."/>
    <button type="submit">🔍 검색</button>
  </form>
</div>

<!-- ── 메인 컨텐츠 ── -->
<div class="wrap">
  <div class="section-header">
    <h2 class="section-title" th:text="${keyword != '' ? '&quot;' + keyword + '&quot; 검색 결과' : (category != '' ? category + ' 도서' : '전체 도서')}">전체 도서</h2>
    <span class="book-count">
            전체 <strong th:text="${totalBooks}">0</strong>권 보유
        </span>
  </div>

  <!-- 카테고리 필터 -->
  <div class="category-bar">
    <a class="cat-btn" th:classappend="${category == '' and keyword == ''} ? 'active'" th:href="@{/}">전체</a>
    <a class="cat-btn" th:classappend="${category == '소설'} ? 'active'" th:href="@{/(category='소설')}">소설</a>
    <a class="cat-btn" th:classappend="${category == '자기계발'} ? 'active'" th:href="@{/(category='자기계발')}">자기계발</a>
    <a class="cat-btn" th:classappend="${category == '경제/경영'} ? 'active'" th:href="@{/(category='경제/경영')}">경제/경영</a>
    <a class="cat-btn" th:classappend="${category == '역사'} ? 'active'" th:href="@{/(category='역사')}">역사</a>
    <a class="cat-btn" th:classappend="${category == '과학'} ? 'active'" th:href="@{/(category='과학')}">과학</a>
    <a class="cat-btn" th:classappend="${category == '컴퓨터/IT'} ? 'active'" th:href="@{/(category='컴퓨터/IT')}">컴퓨터/IT</a>
    <a class="cat-btn" th:classappend="${category == '철학'} ? 'active'" th:href="@{/(category='철학')}">철학</a>
    <a class="cat-btn" th:classappend="${category == '시/에세이'} ? 'active'" th:href="@{/(category='시/에세이')}">시/에세이</a>
  </div>

  <!-- 도서 그리드 -->
  <div class="book-grid">
    <div class="book-card" th:each="book : ${paging.content}">
      <div class="book-cover">📖</div>
      <span class="book-category-badge" th:text="${book.category}">카테고리</span>
      <div class="book-title" th:text="${book.title}">도서명</div>
      <div class="book-author" th:text="${book.author}">저자</div>
      <div class="book-status-row">
                <span class="status-badge"
                      th:classappend="${book.availableQuantity > 0} ? 'status-available' : 'status-unavailable'"
                      th:text="${book.availableQuantity > 0} ? '대출가능 ' + book.availableQuantity + '권' : '대출불가'">
                    대출가능
                </span>
        <button class="btn-loan"
                th:disabled="${book.availableQuantity <= 0}"
                th:attr="data-book-id=${book.id}, data-book-title=${book.title}"
                onclick="loanBook(this)"
                sec:authorize="isAuthenticated()">
          대출
        </button>
      </div>
    </div>
  </div>

  <!-- 검색 결과 없음 -->
  <div th:if="${paging.isEmpty()}" style="text-align:center; padding:60px 0; color:var(--text-muted); font-size:16px;">
    📭 검색 결과가 없습니다.
  </div>

  <!-- 페이지네이션 -->
  <div class="pagination-wrap" th:if="${!paging.isEmpty()}">
    <ul class="pagination">
      <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
        <a class="page-link" th:href="@{/(keyword=${keyword}, category=${category}, page=${paging.number - 1})}">‹</a>
      </li>
      <li class="page-item"
          th:each="p : ${#numbers.sequence(0, paging.totalPages - 1)}"
          th:if="${p >= paging.number - 2 and p <= paging.number + 2}"
          th:classappend="${p == paging.number} ? 'active'">
        <a class="page-link" th:text="${p + 1}"
           th:href="@{/(keyword=${keyword}, category=${category}, page=${p})}"></a>
      </li>
      <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
        <a class="page-link" th:href="@{/(keyword=${keyword}, category=${category}, page=${paging.number + 1})}">›</a>
      </li>
    </ul>
  </div>
</div>

<!-- 알림 토스트 -->
<div class="toast" id="toast"></div>

<script th:inline="javascript">
  const JWT_TOKEN = document.getElementById('jwt-token')?.content;
  const CSRF_HEADER = 'X-XSRF-TOKEN';

  function getCsrfToken() {
      const match = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
      return match ? decodeURIComponent(match[1]) : '';
  }

  function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.background = type === 'error' ? '#e84545' : '#1e3a5f';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // 대출 버튼 클릭
  function loanBook(btn) {
      const bookId = btn.getAttribute('data-book-id');
      const bookTitle = btn.getAttribute('data-book-title');
      if (!confirm('"' + bookTitle + '" 을(를) 대출하시겠습니까?')) return;

      fetch('/api/loan/' + bookId, {
          method: 'POST',
          headers: {
              [CSRF_HEADER]: getCsrfToken(),
              'JWT_TOKEN': JWT_TOKEN || ''
          }
      })
      .then(res => res.text())
      .then(result => {
          if (result === 'SUCCESS') {
              showToast('✅ 대출이 완료되었습니다!', 'success');
              setTimeout(() => location.reload(), 1500);
          } else {
              const msg = result.startsWith('ERROR:') ? result.substring(6) : '대출 처리 중 오류가 발생했습니다.';
              showToast('❌ ' + msg, 'error');
          }
      })
      .catch(() => showToast('❌ 서버 오류가 발생했습니다.', 'error'));
  }

  // 다크 모드
  const toggleBtn = document.getElementById('themeToggle');
  if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      toggleBtn.textContent = '☀️';
  }
  toggleBtn.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark');
      toggleBtn.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
  });
</script>
</body>
</html>
