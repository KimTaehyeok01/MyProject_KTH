<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>foreach문 이해</title>
    <script>
      const numbers = [1, 2, 3, 4, 5];
      let total = 0;

      numbers.forEach((item) => {
        total = total + item;
      });

      console.log(total);

      //[순번]번 사원: [이름] (성적: [점수])
      const employees = [
        { name: "강대리", score: 90 },
        { name: "이사원", score: 60 },
        { name: "박팀장", score: 95 },
      ];
      employees.forEach((item, index) => {
        console.log(`${index + 1}번 사원: ${item.name} (성적 : ${item.score})`);
      });
    </script>
  </head>
  <body></body>
</html>
