<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>JS 문법 공식 총정리 (ex44~ex47)</title>
    <script>
      /*
           --- 변수 선언 없어도 되는 것 ---
      함수명,역할,리턴값(반환값),비고 (원본 변화)
      push(),뒤에 추가,변경된 배열의 길이(숫자),변함 (추가됨)
      pop(),뒤에서 뺌,빠진 놈(값),변함 (삭제됨)
      unshift(),앞에 추가,변경된 배열의 길이(숫자),변함 (추가됨)
      shift(),앞에서 뺌,빠진 놈(값),변함 (삭제됨)
      splice(),중간 삭제/추가,삭제된 놈들(배열),변함 (수정됨)
      sort(),정렬,정렬된 배열 그 자체,변함 (순서 바뀜)
      reverse(),뒤집기,뒤집힌 배열 그 자체,변함 (뒤집힘)
      */

      /* 
          --- 변수 선언이 있어야 하는 것 ---
      함수명,역할,리턴값(반환값),비고 (원본 변화)
      join(),문자로 합치기,합쳐진 문자열,안 변함 (멀쩡)
      slice(),배열 자르기,잘린 새 배열,안 변함 (멀쩡)
      concat(),배열 합치기,합쳐진 새 배열,안 변함 (멀쩡)
      map(),가공하기,가공된 새 배열,안 변함 (멀쩡)
      indexOf()	위치 찾기	인덱스 숫자 (없으면 -1)	안 변함 (멀쩡)
      filter(),걸러내기,걸러진 새 배열,안 변함 (멀쩡)*/
      /* ========================================================================
           [PART 1] 함수 (Function) - ex44
           : 입력(매개변수)을 받아 로직을 수행하고 결과(return)를 뱉는 기계
           ======================================================================== */

      // [공식 1: 선언] function 함수명(매개변수) { 실행코드; return 반환값; }
      function add(a, b) {
        let sum = a + b;
        return sum; // 이 줄이 없으면 undefined 반환
      }

      // [공식 2: 호출] 변수 = 함수명(인자);
      let result = add(10, 20);
      console.log("함수결과:", result); // 30

      /* ========================================================================
           [PART 2] 문자열 (String) - ex45, ex46
           : 읽기 전용(Immutable) 배열. 원본은 절대 변하지 않음.
           ======================================================================== */

      // 1. 아스키코드 변환
      // [공식] 문자 -> 숫자: 문자열.charCodeAt(인덱스)
      // [공식] 숫자 -> 문자: String.fromCharCode(숫자)
      console.log("A".charCodeAt(0)); // 65
      console.log(String.fromCharCode(65)); // "A"

      // 2. 문자열 배열 변환 (★중요)
      // [공식] Array.from(문자열) 또는 [...문자열]
      let charArr = Array.from("Hello"); // ['H', 'e', 'l', 'l', 'o']

      // 3. 문자열 조작 함수 (반드시 변수로 받아야 함)
      let str = "  Hello,World  ";

      // [공식: 길이] 문자열.length
      console.log(str.length); // 15

      // [공식: 검색] 문자열.indexOf("찾을값") -> 인덱스 반환 (없으면 -1)
      console.log(str.indexOf("World")); // 8

      // [공식: 자르기] 문자열.substring(시작, 끝);
      console.log(str.substring(2, 7)); // "Hello" (인덱스 2~6까지)

      // [공식: 분리] 문자열.split("구분자") -> 배열로 변환됨
      let words = str.split(","); // ["  Hello", "World  "]

      // [공식: 공백제거] 문자열.trim()
      console.log(str.trim()); // "Hello,World"

      /* ========================================================================
           [PART 3] 배열 (Array) - ex47
           : 데이터 기차. 수정 가능(Mutable).
           ======================================================================== */

      // 1. 선언
      // [공식] let 변수명 = [값1, 값2, ...];
      let arr = [10, 20, 30];

      // 2. 뒤쪽 조작 (Stack) - 빠름/추천
      // [공식] 배열.push(값); (추가) / 배열.pop(); (삭제)
      arr.push(40); // [10, 20, 30, 40]
      arr.pop(); // 40 삭제됨

      // 3. 앞쪽 조작 (Queue) - 느림
      // [공식] 배열.unshift(값); (추가) / 배열.shift(); (삭제)
      arr.shift(); // 10 삭제됨 -> [20, 30]

      // 4. 중간 조작 (Splice) - 만능함수
      // [공식] 배열.splice(시작인덱스, 삭제개수, 넣을값...);

      // (예시1) 삭제만: 1번 인덱스부터 1개 삭제
      arr.splice(1, 1);

      // (예시2) 끼워넣기: 1번 자리에 0개 지우고 "New" 추가
      arr.splice(1, 0, "New");

      // (예시3) 교체하기: 1번 자리에 1개 지우고 "Update" 추가
      arr.splice(1, 1, "Update");

      /* ========================================================================
           [PART 4] 배열 유틸리티 - ex47 심화
           ======================================================================== */

      let numList = [3, 1, 5, 2, 2];

      // 1. 정렬
      // [공식] 배열.sort(); (오름차순) / 배열.reverse(); (뒤집기)
      numList.sort(); // [1, 2, 2, 3, 5]

      // 2. 합치기
      // [공식] 배열1.concat(배열2)
      let newArr = numList.concat([10, 20]);

      // 3. 중복제거 (Set)
      // [공식] Array.from(new Set(배열))
      let uniqueArr = Array.from(new Set(numList)); // [1, 2, 3, 5]

      // 4. 배열을 문자열로 (Join)
      // [공식] 배열.join("구분자")
      console.log(uniqueArr.join("-")); // "1-2-3-5"
    </script>
  </head>
  <body>
    <h1>JS 공식 총정리 (Code Version)</h1>
  </body>
</html>
