<!doctype html>
<html lang="en">
  <head>
    <!-- ex77 -->
    <title>JS로 html속성 다루기</title>
    <script>
      function changeImg() {
        let img = document.getElementById("img");
        let h1 = document.getElementById("name");
        // src 속성은 get/setAttribute
        if (img.getAttribute("src") === "/image/apple.png") {
          img.setAttribute("src", "/image/banana.png");
        } else {
          img.setAttribute("src", "/image/apple.png");
        }
        h1.innerHTML = "이미지 이름:" + img.getAttribute("src");
      }
    </script>
  </head>
  <body>
    <h1 id="name">이미지 이름</h1>
    <button onclick="changeImg()">이미지 변경하기</button>
    <br />
    <br />
    <img src="/image/apple.png" id="img" />
  </body>
</html>
