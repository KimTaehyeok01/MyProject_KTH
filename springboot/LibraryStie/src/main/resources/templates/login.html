<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>로그인 - 도서관</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8e 50%, #1a6b8a 100%);
            font-family: 'Segoe UI', 'Noto Sans KR', Arial, sans-serif;
        }
        .login-wrap {
            background: rgba(255,255,255,0.97);
            border-radius: 20px;
            padding: 50px 45px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.35);
        }
        .logo-area { text-align: center; margin-bottom: 28px; }
        .logo-icon { font-size: 52px; display: block; margin-bottom: 8px; }
        .logo-title { font-size: 26px; font-weight: 700; color: #1e3a5f; }
        .logo-sub { font-size: 13px; color: #718096; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            color: #2d3748;
            background: #f7fafc;
            outline: none;
            transition: all 0.25s;
        }
        .form-group input:focus {
            border-color: #1e3a5f;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(30,58,95,0.1);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8e 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 14px rgba(30,58,95,0.35);
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(30,58,95,0.45); }
        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 24px 0; color: #a0aec0; font-size: 13px;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
        .sns-btns { display: flex; gap: 10px; flex-direction: column; }
        .btn-kakao, .btn-naver {
            width: 100%; padding: 12px;
            border: none; border-radius: 10px;
            font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.25s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-kakao { background: #FEE500; color: #3A1D1D; }
        .btn-kakao:hover { background: #F5DC00; }
        .btn-naver { background: #03C75A; color: #fff; }
        .btn-naver:hover { background: #02B350; }
        .signup-link { text-align: center; font-size: 14px; color: #718096; margin-top: 20px; }
        .signup-link a { color: #1e3a5f; font-weight: 600; text-decoration: none; }
        .alert-error {
            background: #fff5f5; border: 1px solid rgba(229,62,62,0.3);
            color: #c53030; padding: 12px 16px; border-radius: 10px;
            font-size: 13px; margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="logo-area">
        <span class="logo-icon">📚</span>
        <div class="logo-title">도서관</div>
        <div class="logo-sub">Library Management System</div>
    </div>

    <!-- 로그인 실패 에러 -->
    <div class="alert-error" th:if="${param.error}">
        ⚠️ 아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <!-- 일반 로그인 폼 -->
    <form th:action="@{/loginAction}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-group">
            <label for="userId">아이디</label>
            <input type="text" id="userId" name="userId" placeholder="아이디를 입력하세요" required/>
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required/>
        </div>
        <button type="submit" class="btn-login">🔐 로그인</button>
    </form>

    <div class="divider">또는 소셜 로그인</div>

    <!-- 소셜 로그인 버튼 -->
    <div class="sns-btns">
        <a th:href="@{/oauth2/authorization/kakao}" style="text-decoration:none;">
            <button type="button" class="btn-kakao" style="width:100%;">
                💬 카카오로 로그인
            </button>
        </a>
        <a th:href="@{/oauth2/authorization/naver}" style="text-decoration:none;">
            <button type="button" class="btn-naver" style="width:100%;">
                N 네이버로 로그인
            </button>
        </a>
    </div>

    <p class="signup-link">
        계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
    </p>
</div>
</body>
</html>
