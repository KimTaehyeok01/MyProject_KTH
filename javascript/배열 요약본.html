<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>JS 문법 완전 정복 (Ultimate Cheat Sheet)</title>
    <script>
      /* ========================================================================
           [PART 1] 함수 (Function)
           : 코드를 묶어놓은 박스
           ======================================================================== */

      // 1. 기본 선언
      function basicFunc(x) {
        return x + 1;
      }

      // 2. 익명 함수
      let anonFunc = function (x) {
        return x + 1;
      };

      // 3. 화살표 함수 (실무용)
      let arrowFunc = (x) => x + 1;

      /* ========================================================================
           [PART 2] 문자열 (String)
           🚨 특징: 읽기 전용 (Immutable). 원본 절대 안 변함.
           👉 결론: 무조건 결과를 '변수'에 담아서 써야 함.
           ======================================================================== */

      let str = "Hello World";

      // --- 1. 정보 확인 ---
      let len = str.length; // [변수필수] 길이
      let char = str.charAt(0); // [변수필수] 한 글자 가져오기

      // --- 2. 검색 ---
      let index = str.indexOf("World"); // [변수필수] 위치 찾기
      let hasIt = str.includes("Hello"); // [변수필수] 존재 여부

      // --- 3. 조작 (원본 안 변함!!) ---
      let sub1 = str.substring(0, 5); // [변수필수] 자르기 (Hello)
      let sub2 = str.slice(0, 5); // [변수필수] 자르기 (음수 가능)
      let replaced = str.replace("World", "JS"); // [변수필수] 교체
      let upper = str.toUpperCase(); // [변수필수] 대문자
      let lower = str.toLowerCase(); // [변수필수] 소문자
      let combined = str.concat("!!!"); // [변수필수] 붙이기
      let trimmed = str.trim(); // [변수필수] 공백 제거
      let splitArr = str.split(" "); // [변수필수] 배열로 변환

      /* ========================================================================
           [PART 3] 배열 (Array)
           🚨 특징: 원본을 바꾸는 놈(파괴) vs 안 바꾸는 놈(비파괴) 섞여 있음.
           ======================================================================== */

      // 1. 배열 생성
      let arr1 = [1, 2, 3];
      let arr4 = Array.of(1, 2, 3);
      let arr5 = Array.from("Hello");

      // -----------------------------------------------------------
      // [그룹 A] 원본 파괴자들 (★변수 선언 필요 없음! 그냥 쓰면 됨)
      // -----------------------------------------------------------
      let data = ["A", "B", "C"];

      data.push("D"); // [원본변경] 뒤 추가
      data.pop(); // [원본변경] 뒤 삭제
      data.unshift("Z"); // [원본변경] 앞 추가
      data.shift(); // [원본변경] 앞 삭제

      // ★만능툴: 중간 데이터 삭제/추가 (1번 인덱스부터, 1개 지우고, "B" 넣기)
      data.splice(1, 1, "B"); // [원본변경]

      data.reverse(); // [원본변경] 뒤집기
      data.sort(); // [원본변경] 정렬

      // -----------------------------------------------------------
      // [그룹 B] 원본 지킴이들 (★변수에 저장 안 하면 결과 날아감!)
      // -----------------------------------------------------------
      let nums = [1, 2, 3, 4, 5];

      let subArr = nums.slice(0, 2); // [변수필수] 자르기
      let newArr = nums.concat([6, 7]); // [변수필수] 합치기
      let strResult = nums.join("-"); // [변수필수] 문자로 합치기
      let findIdx = nums.indexOf(3); // [변수필수] 위치 찾기
      let isExist = nums.includes(3); // [변수필수] 존재 여부

      /* ========================================================================
           [PART 4] 배열 반복/변형 (심화)
           ======================================================================== */

      // 1. forEach (단순 반복)
      nums.forEach((item) => {
        console.log(item);
      });

      // 2. map (변신 - 새 배열 반환)
      let doubled = nums.map((item) => item * 2); // [변수필수]

      // 3. filter (필터링 - 새 배열 반환)
      let even = nums.filter((item) => item % 2 === 0); // [변수필수]

      /* ========================================================================
           [PART 5] 형 변환 & 수학 (★보너스 추가)
           : 실무에서 데이터 가공할 때 밥 먹듯이 씀
           ======================================================================== */

      let sNum = "100";
      let nNum = 100;

      // 1. 문자를 숫자로 (String -> Number)
      let result1 = parseInt(sNum); // [변수필수] 정수로 변환 (권장)
      let result2 = Number(sNum); // [변수필수] 숫자로 변환
      let result3 = +sNum; // [변수필수] (꼼수) 앞에 + 붙이면 숫자 됨

      // 2. 숫자를 문자로 (Number -> String)
      let str1 = String(nNum); // [변수필수] "100"
      let str2 = nNum.toString(); // [변수필수] "100"

      // 3. 수학 (Math)
      let pi = 3.141592;
      console.log(Math.round(pi)); // [반올림] 3
      console.log(Math.ceil(pi)); // [올림] 4
      console.log(Math.floor(pi)); // [내림] 3
      console.log(Math.abs(-100)); // [절댓값] 100
      console.log(Math.max(1, 5, 3)); // [최댓값] 5
      console.log(Math.min(1, 5, 3)); // [최솟값] 1
      console.log(Math.random()); // [랜덤] 0 ~ 1 사이 무작위 소수

      /* ========================================================================
           [PART 6] 배열의 끝판왕 reduce (★고급)
           : 합계 구할 때 for문 대신 이거 씀 (간지남)
           ======================================================================== */

      let scores = [10, 20, 30];

      // [역할] 배열을 싹 돌면서 값 하나로 압축함 (acc: 누적값, cur: 현재값)
      // 0은 시작값. (0 + 10 -> 10 + 20 -> 30 + 30 -> 60)
      let sum = scores.reduce((acc, cur) => acc + cur, 0);
      console.log("합계:", sum); // 60
    </script>
  </head>
  <body>
    <h1>JS 문법 마스터 (Complete Reference)</h1>
    <p>F12를 눌러 콘솔을 확인하세요.</p>
  </body>
</html>
