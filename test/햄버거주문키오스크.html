<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>버거 키오스크 (Final)</title>
    <style>
      body {
        text-align: center;
        font-family: sans-serif;
        padding: 30px;
        background-color: #f4f4f4;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        margin: 5px;
        cursor: pointer;
        border: 1px solid #ddd;
        background: white;
      }
      button:hover {
        background-color: #eee;
      }
      .category-btn {
        background-color: #333;
        color: white;
        border: none;
      }
      .category-btn:hover {
        background-color: #555;
      }
      #menu-container {
        margin-top: 20px;
        padding: 20px;
        border: 2px dashed #ccc;
        min-height: 100px;
        background: white;
      }
      .menu-item {
        display: inline-block;
        width: 150px;
        height: 100px;
        margin: 10px;
        background-color: #fff0b3;
        border: 2px solid #ffcc00;
        border-radius: 10px;
        font-weight: bold;
        vertical-align: top;
      }
      .price-tag {
        display: block;
        margin-top: 10px;
        color: #d32f2f;
      }
      h1 {
        color: #d32f2f;
      }
      #total-price {
        color: #d32f2f;
        font-size: 30px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>🍔 버거킹 키오스크</h1>
    <div
      style="
        background: #222;
        padding: 15px;
        border-radius: 10px;
        color: white;
        display: inline-block;
      "
    >
      총 결제 금액: <span id="total-price">0</span>원
    </div>
    <hr />
    <h3>카테고리 선택</h3>
    <button class="category-btn" onclick="filterCategory('all')">
      전체 메뉴
    </button>
    <button class="category-btn" onclick="filterCategory('burger')">
      버거만
    </button>
    <button class="category-btn" onclick="filterCategory('side')">
      사이드만
    </button>
    <button class="category-btn" onclick="filterCategory('drink')">
      음료만
    </button>
    <hr />
    <div id="menu-container"></div>
    <script>
      // 1. 데이터
      const menuList = [
        { id: 1, name: "치즈버거", price: 5000, category: "burger" },
        { id: 2, name: "불고기버거", price: 6000, category: "burger" },
        { id: 3, name: "감자튀김", price: 3000, category: "side" },
        { id: 4, name: "콜라", price: 2000, category: "drink" },
        { id: 5, name: "새우버거", price: 7000, category: "burger" },
        { id: 6, name: "치즈스틱", price: 2500, category: "side" },
      ];

      let totalPrice = 0;

      function menulist(list) {
        const menuHTMLlist = list.map((item) => {
          return `<button class="menu-item" onclick="addToTotal(${item.price})">
                    ${item.name}
                    <span class="price-tag">${item.price}원</span>
                  </button>`;
        });
        document.getElementById("menu-container").innerHTML =
          menuHTMLlist.join(" ");
      }

      function filterCategory(category) {
        let foodlist;
        if (category == "all") {
          foodlist = menuList;
        } else {
          foodlist = menuList.filter((item) => item.category === category);
        }
        menulist(foodlist);
      }

      function addToTotal(price) {
        totalPrice += price;
        document.getElementById("total-price").innerHTML = totalPrice;
      }

      menulist(menuList);
    </script>
  </body>
</html>
