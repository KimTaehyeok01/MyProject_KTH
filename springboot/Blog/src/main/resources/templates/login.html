<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .login-container {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 50px 45px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
      }
      .login-icon {
        text-align: center;
        margin-bottom: 10px;
        font-size: 48px;
      }
      .login-title {
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        color: #2d3748;
        margin-bottom: 6px;
      }
      .login-subtitle {
        text-align: center;
        font-size: 14px;
        color: #718096;
        margin-bottom: 36px;
      }
      .form-group {
        margin-bottom: 22px;
      }
      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #4a5568;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .form-group input {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 15px;
        color: #2d3748;
        background: #f7fafc;
        transition: all 0.3s ease;
        outline: none;
      }
      .form-group input:focus {
        border-color: #667eea;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
      }
      .login-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 28px 0;
        color: #a0aec0;
        font-size: 13px;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e2e8f0;
      }
      .signup-link {
        text-align: center;
        font-size: 14px;
        color: #718096;
      }
      .signup-link a {
        color: #667eea;
        font-weight: 600;
        text-decoration: none;
      }
      .alert {
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .alert-error {
        background: #fff5f5;
        border: 1px solid rgba(229, 62, 62, 0.3);
        color: #c53030;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-icon">🔐</div>
      <h1 class="login-title">로그인</h1>
      <p class="login-subtitle">계정에 로그인하세요</p>

      <div class="alert alert-error" th:if="${param.error}">
        ⚠️ 아이디 또는 비밀번호가 올바르지 않습니다.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="form-group">
          <label for="userId">아이디</label>
          <input
            type="text"
            id="userId"
            name="userId"
            placeholder="아이디를 입력하세요"
            required
          />
        </div>

        <div class="form-group">
          <label for="userPassword">비밀번호</label>
          <input
            type="password"
            id="userPassword"
            name="userPassword"
            placeholder="비밀번호를 입력하세요"
            required
          />
        </div>

        <button type="submit" class="login-btn">로그인</button>
      </form>

      <div class="divider">또는</div>

      <p class="signup-link">
        계정이 없으신가요? <a th:href="@{/user/signup}">회원가입</a>
      </p>
    </div>
  </body>
</html>
