<!DOCTYPE html>
<html lang="en">
  <head>
    <title>연습문제 - 계산기 프로그램</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .wrap {
        width: 600px;
        height: auto;
        border: 1px solid black;
        margin: 0 auto;
      }
      .header {
        display: flex;
        justify-content: center;
        font-size: 40px;
        font-weight: 500;
        margin-top: 20px;
      }
      .minu-header {
        display: flex;
        justify-content: center;
        margin-top: 20px;
        font-size: 24px;
        font-weight: 500;
      }
      .main {
        display: flex;
        width: 100%;
        margin: 0 auto;
        flex-direction: column;
        align-items: center;
      }
      .input1 {
        margin-top: 15px;
        width: 65%;
        height: auto;
        display: flex;
        justify-content: start;
        align-items: center;
        gap: 40px;
      }
      .input1 .inputnum1 {
        font-size: 19px;
        font-weight: 500;
      }
      .input1 #num1 {
        padding: 12px 60px;
        border: 1px solid black;
        background-color: rgb(240, 234, 234);
        border-radius: 5px;
        text-align: center;
      }
      .input2 {
        margin-top: 15px;
        width: 65%;
        height: auto;
        display: flex;
        justify-content: start;
        gap: 40px;
        align-items: center;
      }
      .input2 .inputnum2 {
        font-size: 19px;
        font-weight: 500;
      }
      .input2 #num2 {
        padding: 12px 60px;
        border: 1px solid black;
        border-radius: 5px;
        background-color: rgb(240, 234, 234);
        text-align: center;
      }
      .input-result {
        margin-top: 15px;
        width: 65%;
        height: auto;
        display: flex;
        align-items: center;
        justify-content: start;
        gap: 15px;
      }
      .inputnum-result {
        font-size: 19px;
        font-weight: 500;
      }
      .input-result #result {
        background-color: rgb(185, 184, 184);
        padding: 12px 61px;
        border: 1px solid black;
        border-radius: 5px;
        text-align: center;
      }
      .button-group {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        width: 65%;
        height: auto;
      }
      #odd {
        background-color: rgb(94, 94, 195);
        font-size: 19px;
        padding: 10px 0;
        color: aliceblue;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      #odd:active {
        background-color: rgb(95, 95, 168);
      }
      #subtraction {
        margin-top: 10px;
        background-color: rgb(94, 94, 195);
        font-size: 19px;
        padding: 10px 0;
        color: aliceblue;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      #subtraction:active {
        background-color: rgb(95, 95, 168);
      }
      #multiplication {
        margin-top: 10px;
        background-color: rgb(94, 94, 195);
        font-size: 19px;
        padding: 10px 0;
        color: aliceblue;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      #multiplication:active {
        background-color: rgb(95, 95, 168);
      }
      #Division {
        margin-top: 10px;
        background-color: rgb(94, 94, 195);
        font-size: 19px;
        padding: 10px 0;
        color: aliceblue;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      #Division:active {
        background-color: rgb(95, 95, 168);
      }
      #deleted {
        margin-top: 10px;
        background-color: red;
        font-size: 19px;
        padding: 10px 0;
        color: aliceblue;
        border: none;
        border-radius: 5px;
        margin-bottom: 50px;
        cursor: pointer;
      }
      #deleted:active {
        background-color: rgb(217, 28, 28);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">JavaScript</div>
      <div class="minu-header">계산기 프로그램을 작성해보자</div>

      <div class="main">
        <div class="input1">
          <span class="inputnum1">숫자 1</span>
          <input type="text" id="num1" value="" />
        </div>

        <div class="input2">
          <span class="inputnum2">숫자 2</span>
          <input type="text" id="num2" value="" />
        </div>

        <div class="input-result">
          <span class="inputnum-result">연산 결과</span>
          <input type="text" disabled="disbled" id="result" value="" />
        </div>

        <div class="button-group">
          <button id="odd" onclick="odd()">덧셈</button>
          <button id="subtraction" onclick="subtraction()">뺄셈</button>
          <button id="multiplication" onclick="multiplication()">곱셈</button>
          <button id="Division" onclick="Division()">나눗셈</button>
          <button id="deleted" onclick="deleted()">지우기</button>
        </div>
      </div>
    </div>

    <script>
      function odd() {
        let num1_value = document.getElementById("num1").value;
        let num2_value = document.getElementById("num2").value;
        let result = document.getElementById("result");
        result.value = Number(num1_value) + Number(num2_value);
      }
      function subtraction() {
        let num1_value = document.getElementById("num1").value;
        let num2_value = document.getElementById("num2").value;
        let result = document.getElementById("result");
        result.value = Number(num1_value) - Number(num2_value);
      }
      function multiplication() {
        let num1_value = document.getElementById("num1").value;
        let num2_value = document.getElementById("num2").value;
        let result = document.getElementById("result");
        result.value = Number(num1_value) * Number(num2_value);
      }
      function Division() {
        let num1_value = document.getElementById("num1").value;
        let num2_value = document.getElementById("num2").value;
        let result = document.getElementById("result");
        result.value = Number(num1_value) / Number(num2_value);
      }
      function deleted() {
        let num1_value = document.getElementById("num1");
        let num2_value = document.getElementById("num2");
        let result = document.getElementById("result");
        result.value = "";
        num1_value.value = "";
        num2_value.value = "";
      }
    </script>
  </body>
</html>
