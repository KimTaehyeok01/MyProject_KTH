<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>글 작성</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f7f7f7;
      }
      .wrap {
        width: 700px;
        margin: 40px auto;
        background: #fff;
        padding: 24px;
        border-radius: 10px;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
      }
      textarea {
        height: 240px;
        resize: vertical;
      }
      .row {
        margin: 14px 0;
      }
      .actions {
        margin-top: 18px;
        display: flex;
        gap: 10px;
      }
      button,
      a.btn {
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #ccc;
        background: #fff;
        cursor: pointer;
        text-decoration: none;
        color: #222;
      }
      button.primary {
        background: #007bff;
        color: #fff;
        border-color: #007bff;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2>글 작성</h2>

      <!-- 컨트롤러에서 model.addAttribute("article", new ArticleRequestDto()) 같은 걸 넣어줘야 함 -->
      <form th:action="@{/articles}" th:object="${article}" method="post">
        <div class="row">
          <label>작성자</label>
          <input
            type="text"
            th:field="*{userName}"
            placeholder="이름을 입력하세요"
            required
          />
        </div>

        <div class="row">
          <label>제목</label>
          <input
            type="text"
            th:field="*{title}"
            placeholder="제목을 입력하세요"
            required
          />
        </div>

        <div class="row">
          <label>내용</label>
          <textarea
            th:field="*{content}"
            placeholder="내용을 입력하세요"
            required
          ></textarea>
        </div>

        <div class="actions">
          <button class="primary" type="submit">등록</button>
          <button class="btn" onclick="location.href = '/'">취소</button>
        </div>
      </form>
    </div>
  </body>
</html>
