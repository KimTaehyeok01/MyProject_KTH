<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>window객체</title>
    <!-- JS(TS) 1. HTML안에서 Html과 css를 제어 -->
    <!--        2. JS 런타임(Node.js) - 프론트엔드UI -->
    <!--        3.                    - 백엔드 -->

    <script>
      // 크롬브라우저(V8 -JS런타임(실행기)) - 내장객체
      // 1. window : 웹브라우저 창(화면) 제어
      // 2. document : DOM(Document Object Model)을 제어
      //             : DOM - 웹브라우저가 HTML을 해석해서 가지고 있는 Data 구조.
      // 3. location : 페이지주소(URL) 제어
      // 4. history : 페이지 방문 기록 제어
      // 5. console : 로깅(기록) 제어
      // 6. navigator : 웹브라우저 정보와 사용자 시스템 정보
      // 7. fetch(중요) : http 통신을 담당하는 내장함수

      // window 객체
      //   window.open(); // 비어있는 새창 열기
      //   window.open("https://naver.com");
      // 단독창 열기
      window.open(
        "https://www.google.com",
        "자식창",
        "width=600, height = 300"
      );
    </script>
  </head>
  <body></body>
</html>
