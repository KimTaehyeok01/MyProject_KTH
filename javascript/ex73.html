<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재귀함수</title>
    <script>
      // 재귀함수 : 자기가 자기를 호출하는 함수
      // Recursive Function

      let count = 0; // 전역변수
      function myFunc(param) {
        // 사용자함수
        console.log("myFunc 시작", count);
        count++;

        if (count > 2) {
          count--;
          console.log("탈출1 : count=" + count);
          return;
        }
        myFunc(); // 자신이 자신을 다시 호출 --> 무한루프에 걸림(탈출 조건을 써줘야 함)

        count--;
        console.log("탈출2 : count=" + count);
        return;
      }
      console.log("메인함수 시작");
      myFunc();
      console.log("메인함수 종료");
    </script>
  </head>
  <body></body>
</html>
