<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>문자열을 배열로 취급하기</title>
    <script>
      // 문자열도 내부적으로 배열의 구조를 가지고 있다.
      // 배열처럼 인덱스와 길이가 있다.
      let str = "hello"; // 문자열도 따지고 보면 배열임.
      console.log(str);
      console.log(str[0]);
      console.log(str.length);
      // 문자열 순회
      for (let i = 0; i < str.length; i++) {
        console.log(str[i]);
      }
      console.log("---------------");
      /* for of문으로 써봄. 
      for (let st of str) {
        console.log(st);
      }*/

      // 문자(Character)가 복수로 모이면 문자열(String)이다.
    </script>
  </head>
  <body></body>
</html>
