<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Spartan Array Training</title>
    <script>
      // ==========================================
      // [문제 1] 짝수 수집기 (빈 배열과 Push)
      // ==========================================
      // 요구사항:
      // 1. `evens`라는 빈 배열을 만드세요.
      // 2. 반복문(for)을 1부터 20까지 돌리세요.
      // 3. 현재 숫자가 짝수(i % 2 === 0)라면 `evens` 배열에 추가(push)하세요.
      // 4. 최종 배열을 출력하세요. 결과: [2, 4, 6, ..., 20]

      // ↓↓↓ 코드 작성
      console.log("--- 문제 1 ---");
      let evens = [];

      for (let i = 1; i <= 20; i++) {
        if (i % 2 == 0) {
          evens.push(i);
        }
      }
      console.log(evens);

      // ==========================================
      // [문제 2] 개인정보 마스킹 (문자열 불변성 극복)
      // ==========================================
      let phoneNumber = "010-1234-5678";

      // 요구사항:
      // 1. 위 전화번호 문자열을 배열로 변환하여 `phoneArr`에 담으세요. (Array.from 사용)
      // 2. 배열의 뒤에서 4개 글자(인덱스 9, 10, 11, 12)를 모두 '*' 문자로 수정하세요.
      // 3. 반복문을 이용해 배열을 다시 문자열 형태로 이어 붙여서 출력하세요.
      //    (결과 예시: "010-1234-****")

      // ↓↓↓ 코드 작성
      console.log("--- 문제 2 ---");
      let phoneArr = Array.from(phoneNumber);
      console.log(phoneArr);
      for (let i = 9; i < phoneArr.length; i++) {
        phoneArr[i] = "*";
      }
      let number = "";
      for (let i = 0; i < phoneArr.length; i++) {
        number += phoneArr[i];
      }
      console.log(number);

      // ==========================================
      // [문제 3] 문자열의 아스키 합계 구하기
      // ==========================================
      let secretCode = "ABC"; // A=65, B=66, C=67

      // 요구사항:
      // 1. `secretCode`의 모든 글자의 아스키코드 값을 더한 총합을 구하세요.
      // 2. 반복문과 `charCodeAt`을 사용하세요.
      // 3. 결과(198)를 출력하세요.

      // ↓↓↓ 코드 작성
      console.log("--- 문제 3 ---");
      let asciiSum = 0;
      for (let i = 0; i < secretCode.length; i++) {
        let code = secretCode.charCodeAt(i);
        asciiSum += code;
      }
      console.log(asciiSum);

      // ==========================================
      // [문제 4] CSV 데이터 평균 구하기 (Split & Type)
      // ==========================================
      let data = "50,70,30,90,10"; // 학생 5명의 점수

      // 요구사항:
      // 1. 문자열을 쉼표(,) 기준으로 잘라서 배열 `scores`로 만드세요.
      // 2. 배열에 들어있는 점수들의 "평균(Total / 개수)"을 구해서 출력하세요.
      // 3. (주의) 문자열을 숫자로 변환해서 더해야 합니다.

      // ↓↓↓ 코드 작성
      console.log("--- 문제 4 ---");
      let Total = 0;
      let avg = 0;
      let scores = "50,70,30,90,10".split(","); // 배열이 아닌것을 배열로 만드는지 궁금(제미나이한테 물어보기)
      for (let score of scores) {
        Total += Number(score);
      }
      console.log("총점수:", Total);
      avg = Number(Total / scores.length);
      console.log("평균:", avg);
    </script>
  </head>
  <body>
    <h1>스파르타 코딩 테스트</h1>
  </body>
</html>
